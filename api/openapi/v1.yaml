    get:
      operationId: listWorkflowCandidates
      tags:
      - Workflows
      summary: List Processing candidate states
      description: Requires `rule.read` on the Workflow.
      security:
      - sessionCookie: []
      - accessKey: []
      - {}
      parameters:
      - $ref: '#/components/parameters/Offset'
      - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Caller-visible page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CandidatePageResponse'
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /workflows/{id}/candidates/{candidate}:
    parameters:
    - $ref: '#/components/parameters/ID'
    - $ref: '#/components/parameters/CandidateID'
    get:
      operationId: readWorkflowCandidate
      tags:
      - Workflows
      summary: Read one candidate state
      description: Requires `rule.read`. Absent, deleted and invisible items are all 404.
      security:
      - sessionCookie: []
      - accessKey: []
      - {}
      responses:
        '200':
          description: The resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CandidateResponse'
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /workflows/{id}/candidates/{candidate}/result:
    parameters:
    - $ref: '#/components/parameters/ID'
    - $ref: '#/components/parameters/CandidateID'
    get:
      operationId: readWorkflowCandidateResult
      tags:
      - Workflows
      summary: Read result metadata of a candidate
      description: Requires `rule.read`. Absent, deleted and invisible items are all 404. Returns identifiers and
        timing only, never evaluated fields.
      security:
      - sessionCookie: []
      - accessKey: []
      - {}
      responses:
        '200':
          description: The resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultMetadataResponse'
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /workflows/{id}/candidates/{candidate}/retry:
    parameters:
    - $ref: '#/components/parameters/ID'
    - $ref: '#/components/parameters/CandidateID'
    post:
      operationId: retryWorkflowCandidate
      tags:
      - Workflows
      summary: Retry a failed candidate
      description: |
        Requires `rule.reprocess`. Only a `failed` candidate of an unpublished Transmission can be
        retried; it becomes `pending` and due immediately. `expectedRevision` is the candidate
        revision; a mismatch is 409 `REVISION_CONFLICT`. The candidate must also still be current: the
        Transmission's targets, source and context revisions, the Workflow's active version and
        revision, the Processing configuration revision and every referenced instance are rechecked,
        and any change is 409 `REVISION_CONFLICT`.
         The body is limited to 1 MiB and is decoded strictly: unknown fields, duplicate object keys and trailing data are 400.
      security:
      - sessionCookie: []
        csrfToken: []
      - accessKey: []
      - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RetryCandidateRequest'
      responses:
        '200':
          description: Candidate rescheduled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CandidateRetryResponse'
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/RevisionConflict'
        '413':
          $ref: '#/components/responses/ResourceLimit'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /instances:
    get:
      operationId: listInstances
      tags:
      - Processing instances
      summary: List plugin instances
      description: Requires the global (`all`) `plugin.configure` right. Offset paging.
      security:
      - sessionCookie: []
      - accessKey: []
      - {}
      parameters:
      - $ref: '#/components/parameters/Offset'
      - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Instance summaries.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstancePageResponse'
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    post:
      operationId: createInstance
      tags:
      - Processing instances
      summary: Create a plugin instance
      description: 'Requires the global `plugin.configure` right. Loads and verifies the manifests and artifact
        digests under the operator''s artifact root (without starting the plugin) and validates `configuration`.
        Without an artifact root, 503 `AUTHORITY_UNAVAILABLE`; an unsupported manifest schema or SDK is 409 `INCOMPATIBLE_VERSION`.
        Idempotent per (caller, `commandId`): an identical replay returns the original result; reusing the `commandId`
        with different input is 409 `IDEMPOTENCY_CONFLICT`. The body is limited to 1 MiB and is decoded strictly: unknown
        fields, duplicate object keys and trailing data are 400.'
      security:
      - sessionCookie: []
        csrfToken: []
      - accessKey: []
      - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInstanceRequest'
      responses:
        '201':
          description: Instance created (or replayed).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandResponse'
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/VersionConflict'
        '413':
          $ref: '#/components/responses/ResourceLimit'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /instances/{id}:
    parameters:
    - $ref: '#/components/parameters/ID'
    get:
      operationId: readInstance
      tags:
      - Processing instances
      summary: Read a plugin instance
      description: 'Requires `plugin.configure`. Absent, deleted and invisible items are all 404. Configuration
        is projected through the current manifest policy: secret and user-scoped values are redacted. Without an
        artifact root, 503 `AUTHORITY_UNAVAILABLE`.'
      security:
      - sessionCookie: []
      - accessKey: []
      - {}
      responses:
        '200':
          description: The resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstanceResponse'
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    put:
      operationId: updateInstance
      tags:
      - Processing instances
      summary: Save a new instance revision
      description: 'Requires the global `plugin.configure` right. Requires both `commandId` and `expectedRevision`
        (> 0). Every save appends a new immutable revision. Idempotent per (caller, `commandId`): an identical replay
        returns the original result; reusing the `commandId` with different input is 409 `IDEMPOTENCY_CONFLICT`. Optimistic
        concurrency via `expectedRevision`; a stale value is 409 `REVISION_CONFLICT`. The body is limited to 1 MiB
        and is decoded strictly: unknown fields, duplicate object keys and trailing data are 400.'
      security:
      - sessionCookie: []
        csrfToken: []
      - accessKey: []
      - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateInstanceRequest'
      responses:
        '200':
          description: New revision.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandResponse'
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/VersionConflict'
        '413':
          $ref: '#/components/responses/ResourceLimit'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: gopager_session
      description: |
        Browser session from POST /auth/login. A duplicate, empty or malformed cookie is 401 (no
        fallback to anonymous). It is ignored when an `Authorization` header is present. Session
        requests with a method other than GET, HEAD or OPTIONS must also send exactly one `Origin`
        header equal to the configured public origin and the `X-CSRF-Token` header (see
        `csrfToken`); otherwise 403 `FORBIDDEN`. Lifetime: 30 days absolute, 7 days idle.
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: |
        The session's `csrfToken` (from login or GET /auth/session). Required, together with a
        matching `Origin` header, on unsafe methods authenticated by `sessionCookie`. Not used with
        bearer or anonymous requests.
    accessKey:
      type: http
      scheme: bearer
      description: |
        Access key of a non-guest account: exactly one `Authorization: Bearer <secret>` header, the
        secret being 43 characters of unpadded base64url (256 bits). Anything else is 401. The key's
        restrictions only narrow the owning account's rights. The API has no endpoint that issues
        access keys. Requests without any credential run as the guest account (401 if none exists).
    gatewayCredential:
      type: http
      scheme: bearer
      description: |
        Gateway credential (same secret format as access keys), issued via
        POST /gateways/{id}/credentials. Only accepted by POST /transmissions and POST /gateway/state;
        missing, malformed, unknown or revoked credentials are 401. The first request with a pending
        credential promotes it to current and revokes the previous one.
  parameters:
    ID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Resource ID (not the nil UUID); a malformed value is 400.
    CredentialID:
      name: credentialId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    VersionID:
      name: version
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Workflow version ID.
    CandidateID:
      name: candidate
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Processing candidate ID.
    Offset:
      name: offset
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    OriginHeader:
      name: Origin
      in: header
      required: true
      schema:
        type: string
      description: Exactly one value, equal to the configured public origin after normalization (lower-cased host,
        IDN to ASCII, default port dropped).
  responses:
    InvalidInput:
      description: Malformed body, wrong media type, unknown field, bad UUID or paging parameter, or an invalid
        value.
      content:
        application/json:
          schema:
            allOf:
            - $ref: '#/components/schemas/Error'
            - type: object
              properties:
                code:
                  type: string
                  enum:
                  - INVALID_INPUT
    Unauthorized:
      description: No valid credential, or the credential expired or was revoked.
      content:
        application/json:
          schema:
            allOf:
            - $ref: '#/components/schemas/Error'
            - type: object
              properties:
                code:
                  type: string
                  enum:
                  - LOGIN_REQUIRED
    Forbidden:
      description: Not permitted, or a failed Origin/CSRF check.
      content:
        application/json:
          schema:
            allOf:
            - $ref: '#/components/schemas/Error'
            - type: object
              properties:
                code:
                  type: string
                  enum:
                  - FORBIDDEN
    NotFound:
      description: Absent, deleted, or outside the caller's read scope (indistinguishable).
      content:
        application/json:
          schema:
            allOf:
            - $ref: '#/components/schemas/Error'
            - type: object
              properties:
                code:
                  type: string
                  enum:
                  - NOT_FOUND
    RevisionConflict:
      description: '`REVISION_CONFLICT` (retryable): stale expected revision or a conflicting configuration; reload
        before retrying. `IDEMPOTENCY_CONFLICT` (not retryable): `commandId` reused by the same caller with a different
        operation or input.'
      content:
        application/json:
          schema:
            allOf:
            - $ref: '#/components/schemas/Error'
            - type: object
              properties:
                code:
                  type: string
                  enum:
                  - REVISION_CONFLICT
                  - IDEMPOTENCY_CONFLICT
    VersionConflict:
      description: Revision or idempotency conflict as above, or an incompatible plugin manifest version.
      content:
        application/json:
          schema:
            allOf:
            - $ref: '#/components/schemas/Error'
            - type: object
              properties:
                code:
                  type: string
                  enum:
                  - REVISION_CONFLICT
                  - IDEMPOTENCY_CONFLICT
                  - INCOMPATIBLE_VERSION
    IdempotencyConflict:
      description: '`submissionId` reused with different content.'
      content:
        application/json:
          schema:
            allOf:
            - $ref: '#/components/schemas/Error'
            - type: object
              properties:
                code:
                  type: string
                  enum:
                  - IDEMPOTENCY_CONFLICT
    ResourceLimit:
      description: Body or collection size limit exceeded, or revision counter exhausted.
      content:
        application/json:
          schema:
            allOf:
            - $ref: '#/components/schemas/Error'
            - type: object
              properties:
                code:
                  type: string
                  enum:
                  - RESOURCE_LIMIT
    RateLimited:
      description: Login attempts throttled. `retryAfterSeconds` matches `Retry-After`.
      content:
        application/json:
          schema:
            allOf:
            - $ref: '#/components/schemas/Error'
            - type: object
              properties:
                code:
                  type: string
                  enum:
                  - RATE_LIMITED
      headers:
        Retry-After:
          description: Seconds until the next attempt.
          schema:
            type: integer
            minimum: 1
    InternalError:
      description: Unexpected failure.
      content:
        application/json:
          schema:
            allOf:
            - $ref: '#/components/schemas/Error'
            - type: object
              properties:
                code:
                  type: string
                  enum:
                  - INTERNAL_ERROR
    ServiceUnavailable:
      description: Process not ready or shutting down (`AUTHORITY_UNAVAILABLE`, returned before any database access),
        a required component unavailable, storage unavailable, or an uncertain commit.
      content:
        application/json:
          schema:
            allOf:
            - $ref: '#/components/schemas/Error'
            - type: object
              properties:
                code:
                  type: string
                  enum:
                  - STORAGE_UNAVAILABLE
                  - AUTHORITY_UNAVAILABLE
                  - COMMIT_UNCERTAIN
  schemas:
    SchemaVersion:
      type: integer
      enum:
      - 1
    Revision:
      type: string
      pattern: ^[1-9][0-9]*$
      description: Positive revision as a decimal string (int64 range).
    Liveness:
      type: object
      required:
      - live
      properties:
        live:
          type: boolean
    Readiness:
      type: object
      required:
      - ready
      properties:
        ready:
          type: boolean
    LoginRequest:
      type: object
      required:
      - schemaVersion
      - username
      - password
      properties:
        schemaVersion:
          $ref: '#/components/schemas/SchemaVersion'
        username:
          type: string
          description: Compared after NFC normalization and case folding; leading or trailing whitespace is 400.
        password:
          type: string
          format: password
      additionalProperties: false
    LoginResponse:
      type: object
      required:
      - schemaVersion
      - sessionId
      - csrfToken
      - expiresAt
      properties:
        schemaVersion:
          $ref: '#/components/schemas/SchemaVersion'
        sessionId:
          type: string
          format: uuid
        csrfToken:
          type: string
          description: Send as `X-CSRF-Token` on unsafe session requests.
        expiresAt:
          type: string
          format: date-time
          description: Absolute session expiry (30 days after login); RFC 3339 with fractional seconds.
    SessionResponse:
      type: object
      required:
      - schemaVersion
      - principalId
      - sessionId
      - csrfToken
      - expiresAt
      properties:
        schemaVersion:
          $ref: '#/components/schemas/SchemaVersion'
        principalId:
          type: string
          format: uuid
        sessionId:
          type: string
          format: uuid
        csrfToken:
          type: string
        expiresAt:
          type: string
          format: date-time
          description: 'Effective expiry: the earlier of the absolute expiry and 7 days after the last authenticated
            use.'
    CommandResult:
      type: object
      description: Identifier and resulting revision of the created or changed item.
      required:
      - id
      - revision
      properties:
        id:
          type: string
          format: uuid
        revision:
          $ref: '#/components/schemas/Revision'
    CommandResponse:
      type: object
      required:
      - schemaVersion
      - data
      properties:
        schemaVersion:
          $ref: '#/components/schemas/SchemaVersion'
        data:
          $ref: '#/components/schemas/CommandResult'
    DeletionResult:
      type: object
      required:
      - id
      - revision
      - status
      properties:
        id:
          type: string
          format: uuid
        revision:
          $ref: '#/components/schemas/Revision'
        status:
          type: string
          enum:
          - pending
          description: Historical assignment correction is queued.
    DeletionResponse:
      type: object
      required:
      - schemaVersion
      - data
      properties:
        schemaVersion:
          $ref: '#/components/schemas/SchemaVersion'
        data:
          $ref: '#/components/schemas/DeletionResult'
    ValidResponse:
      type: object
      required:
      - schemaVersion
      - data
      properties:
        schemaVersion:
          $ref: '#/components/schemas/SchemaVersion'
        data:
          type: object
          required:
          - valid
          properties:
            valid:
              type: boolean
              enum:
              - true
    DeleteRequest:
      type: object
      description: Body for revision-checked deletes and version activation.
      required:
      - schemaVersion
      - expectedRevision
      properties:
        schemaVersion:
          $ref: '#/components/schemas/SchemaVersion'
        expectedRevision:
          $ref: '#/components/schemas/Revision'
      additionalProperties: false
    Color:
      type: string
      pattern: ^#[0-9A-Fa-f]{6}$
      description: Stored and returned in upper case.
    IconRef:
      type: string
      minLength: 1
      maxLength: 128
      pattern: ^[A-Za-z0-9._-]+$
    FunctionMeanings:
      type: object
      maxProperties: 4
      additionalProperties: false
      description: Labels keyed by POCSAG function 0–3.
      properties:
        '0':
          type: string
          minLength: 1
          maxLength: 256
          pattern: \S
        '1':
          type: string
          minLength: 1
          maxLength: 256
          pattern: \S
        '2':
          type: string
          minLength: 1
          maxLength: 256
          pattern: \S
        '3':
          type: string
          minLength: 1
          maxLength: 256
          pattern: \S
    UnitSettingColor:
      oneOf:
      - type: object
        properties:
          mode:
            type: string
            enum:
            - inherit
            - unset
        additionalProperties: false
        required:
        - mode
      - type: object
        required:
        - mode
        - value
        properties:
          mode:
            type: string
            enum:
            - value
          value:
            $ref: '#/components/schemas/Color'
        additionalProperties: false
    UnitSettingColorInput:
      oneOf:
      - type: object
        properties:
          mode:
            type: string
            enum:
            - inherit
            - unset
        additionalProperties: false
      - type: object
        required:
        - mode
        - value
        properties:
          mode:
            type: string
            enum:
            - value
          value:
            $ref: '#/components/schemas/Color'
        additionalProperties: false
      description: An omitted `mode` means `inherit`.
    DefaultColor:
      oneOf:
      - type: object
        properties:
          mode:
            type: string
            enum:
            - unset
        additionalProperties: false
        required:
        - mode
      - type: object
        required:
        - mode
        - value
        properties:
          mode:
            type: string
            enum:
            - value
          value:
            $ref: '#/components/schemas/Color'
        additionalProperties: false
    UnitSettingIcon:
      oneOf:
      - type: object
        properties:
          mode:
            type: string
            enum:
            - inherit
            - unset
        additionalProperties: false
        required:
        - mode
      - type: object
        required:
        - mode
        - value
        properties:
          mode:
            type: string
            enum:
            - value
          value:
            $ref: '#/components/schemas/IconRef'
        additionalProperties: false
    UnitSettingIconInput:
      oneOf:
      - type: object
        properties:
          mode:
            type: string
            enum:
            - inherit
            - unset
        additionalProperties: false
      - type: object
        required:
        - mode
        - value
        properties:
          mode:
            type: string
            enum:
            - value
          value:
            $ref: '#/components/schemas/IconRef'
        additionalProperties: false
      description: An omitted `mode` means `inherit`.
    DefaultIcon:
      oneOf:
      - type: object
        properties:
          mode:
            type: string
            enum:
            - unset
        additionalProperties: false
        required:
        - mode
      - type: object
        required:
        - mode
        - value
        properties:
          mode:
            type: string
            enum:
            - value
          value:
            $ref: '#/components/schemas/IconRef'
        additionalProperties: false
    UnitSettingFunctionMeanings:
      oneOf:
      - type: object
        properties:
          mode:
            type: string
            enum:
            - inherit
            - unset
        additionalProperties: false
        required:
        - mode
      - type: object
        required:
        - mode
        - value
        properties:
          mode:
            type: string
            enum:
            - value
          value:
            $ref: '#/components/schemas/FunctionMeanings'
        additionalProperties: false
    UnitSettingFunctionMeaningsInput:
      oneOf:
      - type: object
        properties:
          mode:
            type: string
            enum:
            - inherit
            - unset
        additionalProperties: false
      - type: object
        required:
        - mode
        - value
        properties:
          mode:
            type: string
            enum:
            - value
          value:
            $ref: '#/components/schemas/FunctionMeanings'
        additionalProperties: false
      description: An omitted `mode` means `inherit`.
    DefaultFunctionMeanings:
      oneOf:
      - type: object
        properties:
          mode:
            type: string
            enum:
            - unset
        additionalProperties: false
        required:
        - mode
      - type: object
        required:
        - mode
        - value
        properties:
          mode:
            type: string
            enum:
            - value
          value:
            $ref: '#/components/schemas/FunctionMeanings'
        additionalProperties: false
    Settings:
      type: object
      description: Stored Unit or template settings.
      required:
      - color
      - icon
      - functionMeanings
      properties:
        color:
