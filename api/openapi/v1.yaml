    Protocol:
      type: string
      enum:
      - pocsag
      - flex
      - zvei
      - eas
    PocsagSelector:
      type: object
      description: POCSAG address range (inclusive, `from` ≤ `to`).
      required:
      - from
      - to
      - mode
      properties:
        from:
          type: integer
          format: int64
          minimum: 0
          maximum: 2097151
        to:
          type: integer
          format: int64
          minimum: 0
          maximum: 2097151
        mode:
          type: string
          enum:
          - function-bit
          - subaddress
        functions:
          type: array
          minItems: 1
          maxItems: 4
          uniqueItems: true
          items:
            type: integer
            minimum: 0
            maximum: 3
          description: Omitted means all four functions. Returned sorted.
      additionalProperties: false
    FlexSelector:
      type: object
      description: FLEX address range (inclusive). Every address in the range must belong to a supported FLEX message-address
        class.
      required:
      - from
      - to
      properties:
        from:
          type: integer
          format: int64
          minimum: 0
        to:
          type: integer
          format: int64
          minimum: 0
      additionalProperties: false
    CodeSelector:
      type: object
      description: ZVEI or EAS code.
      required:
      - value
      properties:
        value:
          type: string
          pattern: ^[0-9]{5,6}$
          description: 'ZVEI: exactly 5 digits; EAS: exactly 6 digits.'
      additionalProperties: false
    Selector:
      description: Must match `protocol`. Explicit nulls and unknown members are 400.
      oneOf:
      - $ref: '#/components/schemas/PocsagSelector'
      - $ref: '#/components/schemas/FlexSelector'
      - $ref: '#/components/schemas/CodeSelector'
