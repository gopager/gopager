        main:
          $ref: '#/components/schemas/ProvisionedArtifact'
        preview:
          $ref: '#/components/schemas/ProvisionedArtifact'
        configuration:
          $ref: '#/components/schemas/TypedValue'
      additionalProperties: false
    InstanceArtifact:
      type: object
