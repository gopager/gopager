          - delivery
        revision:
          type: string
          pattern: ^(0|[1-9][0-9]*)$
          description: 0 or absent, or the instance's current revision; anything else is 409 `REVISION_CONFLICT`.
        inputs:
          type: object
          maxProperties: 64
          additionalProperties:
            $ref: '#/components/schemas/TypedValue'
          description: Constants for inputs the instance's descriptor declares; names are 1 to 128 bytes.
      additionalProperties: false
    SubscriptionTarget:
      type: object
      required:
      - instanceId
      - capabilityKind
      - revision
      - inputs
      properties:
        instanceId:
          type: string
          format: uuid
        capabilityKind:
          type: string
          enum:
          - delivery
        revision:
          $ref: '#/components/schemas/Revision'
          description: The instance revision current when the Subscription was saved.
        inputs:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/TypedValue'
    SubscriptionInput:
      type: object
      description: The writable part of a Subscription.
      required:
      - kind
      - state
      - eventTypes
      - targets
      properties:
        kind:
          $ref: '#/components/schemas/SubscriptionKind'
        subscriberId:
          type: string
          format: uuid
          description: Required for a global Subscription (an active technical account), forbidden for a personal one.
            On update it must be absent or unchanged.
        state:
          $ref: '#/components/schemas/SubscriptionState'
        eventTypes:
          type: array
          minItems: 1
          maxItems: 16
          uniqueItems: true
          items:
            type: string
            enum:
            - message.created
            - message.transmission-joined
            - message.merged
            - assignment.changed
            - suppression.changed
            - processing.completed
            - gateway.state-changed
          description: Deliverable Domain event types. Stored sorted.
        filter:
          $ref: '#/components/schemas/DeliveryPredicate'
        targets:
          type: array
          minItems: 1
          maxItems: 8
          items:
            $ref: '#/components/schemas/SubscriptionTargetInput'
          description: Distinct instances.
        layoutId:
          type: string
          format: uuid
          description: A layout whose output kind every target supports. Absent selects the built-in layout.
        splitByUnit:
          type: boolean
          description: One Delivery per relevant Unit instead of one per target. Needs the `unit` field group.
        maxAgeSeconds:
          type: integer
          minimum: 1
          maximum: 86400
          description: Deliveries expire this long after the Message time anchor. Absent applies only the 24-hour limit.
    Subscription:
      type: object
      required:
      - id
      - revision
      - kind
      - subscriberId
      - state
      - eventTypes
      - targets
      - splitByUnit
      - health
      - createdAt
      - updatedAt
      properties:
        id:
          type: string
          format: uuid
        revision:
          $ref: '#/components/schemas/Revision'
        kind:
          $ref: '#/components/schemas/SubscriptionKind'
        subscriberId:
          type: string
          format: uuid
          description: The account the Subscription acts as, which is the owner of a personal one and the technical
            account of a global one.
        state:
          $ref: '#/components/schemas/SubscriptionState'
        eventTypes:
          type: array
          items:
            type: string
        filter:
          $ref: '#/components/schemas/DeliveryPredicate'
        targets:
          type: array
          items:
            $ref: '#/components/schemas/SubscriptionTarget'
        layoutId:
          type: string
          format: uuid
        splitByUnit:
          type: boolean
        maxAgeSeconds:
          type: integer
        health:
          $ref: '#/components/schemas/SubscriptionHealth'
        healthReason:
          $ref: '#/components/schemas/SubscriptionHealthReason'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    SubscriptionHealth:
      type: string
      description: '`invalid` Subscriptions create no Deliveries until a save that compiles sets them `valid`.'
      enum:
      - valid
      - invalid
    SubscriptionHealthReason:
      type: string
      description: Why the Subscription is invalid; omitted while it is valid.
      enum:
      - filter-invalid
      - field-unavailable
      - layout-invalid
      - resource-limit
    SubscriptionResponse:
      type: object
      required:
      - schemaVersion
      - data
      properties:
        schemaVersion:
          $ref: '#/components/schemas/SchemaVersion'
        data:
          $ref: '#/components/schemas/Subscription'
    SubscriptionPageResponse:
      type: object
      required:
      - schemaVersion
      - data
      properties:
        schemaVersion:
          $ref: '#/components/schemas/SchemaVersion'
        data:
          type: object
          required:
          - items
          - total
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Subscription'
            total:
              type: integer
              minimum: 0
    CreateSubscriptionRequest:
      description: A `SubscriptionInput` with `schemaVersion` and `commandId`. Unknown fields are 400.
      allOf:
      - $ref: '#/components/schemas/SubscriptionInput'
      - type: object
        required:
        - schemaVersion
        - commandId
        properties:
          schemaVersion:
            $ref: '#/components/schemas/SchemaVersion'
          commandId:
            type: string
            format: uuid
            description: Client-generated idempotency key (not the nil UUID).
    UpdateSubscriptionRequest:
      description: A `SubscriptionInput` with `schemaVersion` and `expectedRevision`; no `commandId`. Unknown fields are 400.
      allOf:
      - $ref: '#/components/schemas/SubscriptionInput'
      - type: object
        required:
        - schemaVersion
        - expectedRevision
        properties:
          schemaVersion:
            $ref: '#/components/schemas/SchemaVersion'
          expectedRevision:
            $ref: '#/components/schemas/Revision'
    DeliveryState:
      type: string
      description: '`prepared`, `started` and `retry-pending` are open; the others are terminal.'
      enum:
      - prepared
      - started
      - retry-pending
      - accepted
      - failed
      - uncertain
      - expired
      - cancelled
    DeliveryOutcomeCode:
      type: string
      description: Why a Delivery or attempt is in its state. See docs/http-api.md (Deliveries) for the meaning of each
        code.
      enum:
      - accepted
      - transient
      - permanent
      - retry-exhausted
      - uncertain
      - lease-lost
      - expired
      - subscription-paused
      - subscription-changed
      - subscription-deleted
      - authority-revoked
      - no-longer-matching
      - parameter-conflict
      - input-invalid
      - render-limit
      - rate-limited
      - dependency-unavailable
    DeliveryAttempt:
      type: object
      required:
      - number
      - id
      - state
      - instanceRevision
      - startedAt
      properties:
        number:
