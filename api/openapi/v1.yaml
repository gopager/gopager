        fields:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/FieldValue'
          description: Omitted when not selected or when results are per target; `{}` when selected without outputs.
        targetResults:
          type: array
          items:
            type: object
            required:
            - targetPosition
            - fields
            properties:
              targetPosition:
                type: integer
                minimum: 0
              fields:
                type: object
                additionalProperties:
                  $ref: '#/components/schemas/FieldValue'
          description: Per original target position, for target-dependent Workflows.
    EvaluationResponse:
      type: object
      required:
      - schemaVersion
