        `gatewayNetworkIdentifier`, the only Network for the protocol, the only Network with a
        matching Address rule, the protocol's default Network; if none applies, 400 `INVALID_INPUT`.
        The status is 202 while the receipt's `processingStatus` is `pending`, else 200. Accepted evidence
        is visible to readers in every case; Workflow results attach to the Message when they complete.
      security:
      - gatewayCredential: []
