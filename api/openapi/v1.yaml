        executionPrincipalId:
          type: string
          format: uuid
          description: Principal the plugin runs as; must currently resolve.
        main:
          $ref: '#/components/schemas/ProvisionedArtifact'
        preview:
          $ref: '#/components/schemas/ProvisionedArtifact'
