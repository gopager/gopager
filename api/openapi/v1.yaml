        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    put:
      operationId: renameAgency
      tags:
      - Agencies
      summary: Rename an Agency
      description: Requires `agency.update`. Optimistic concurrency via `expectedRevision`; a stale value
        is 409 `REVISION_CONFLICT`.
      security:
      - sessionCookie: []
        csrfToken: []
      - accessKey: []
      - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAgencyRequest'
      responses:
        '200':
          description: New revision.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandResponse'
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/RevisionConflict'
        '413':
          $ref: '#/components/responses/ResourceLimit'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    delete:
      operationId: deleteAgency
      tags:
      - Agencies
      summary: Delete an Agency
      description: Requires `agency.delete` (scope `all`). Optimistic concurrency via `expectedRevision`; a stale
        value, or an Agency that still owns Units or Networks, is 409 `REVISION_CONFLICT`.
      security:
      - sessionCookie: []
        csrfToken: []
      - accessKey: []
      - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteRequest'
      responses:
        '200':
          description: Deleted; final revision.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandResponse'
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/RevisionConflict'
        '413':
          $ref: '#/components/responses/ResourceLimit'
        '500':
