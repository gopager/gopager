        name:
          type: string
          minLength: 1
          maxLength: 256
        definition:
          $ref: '#/components/schemas/LayoutDefinition'
        agencies:
          $ref: '#/components/schemas/AssignedAgencies'
      additionalProperties: false
    AssignedAgencies:
      type: array
      minItems: 1
      maxItems: 256
      uniqueItems: true
      description: Distinct Agencies the definition is assigned to; they decide who may see, use and manage it.
      items:
        type: string
        format: uuid
    AttributeField:
      type: object
      description: |
        A typed field with display metadata. `properties` (kind `object`) and `element` (kind `list`) nest at most 32 levels.
        Top-level fields are always optional; `optional` applies to object properties only.
      required:
      - kind
      properties:
        kind:
          $ref: '#/components/schemas/ValueKind'
        optional:
          type: boolean
        nullable:
          type: boolean
        properties:
          type: object
          description: Property names are 1 to 64 ASCII letters, digits and `_`, starting with a letter.
          additionalProperties:
            $ref: '#/components/schemas/AttributeField'
        element:
          $ref: '#/components/schemas/AttributeField'
        label:
          type: string
          maxLength: 256
        description:
          type: string
          maxLength: 2048
        icon:
          type: string
        deprecated:
          type: boolean
      additionalProperties: false
    AttributeSchema:
      type: object
      required:
      - key
      - label
      - subject
      - fields
      - agencies
      - deprecated
      - revision
      - createdAt
      - updatedAt
      properties:
        key:
          type: string
          pattern: '^[a-z][a-z0-9-]*$'
          maxLength: 64
        label:
          type: string
          minLength: 1
          maxLength: 256
        description:
          type: string
          maxLength: 2048
        subject:
          type: string
          enum:
          - message
          - unit
        fields:
          type: object
          minProperties: 1
          description: Top-level field names are 1 to 64 ASCII letters, digits and `_`, starting with a letter.
          additionalProperties:
            $ref: '#/components/schemas/AttributeField'
        agencies:
          $ref: '#/components/schemas/AssignedAgencies'
        deprecated:
          type: boolean
        revision:
          $ref: '#/components/schemas/Revision'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    AttributeSchemaResponse:
      type: object
      required:
      - schemaVersion
      - data
      properties:
        schemaVersion:
          $ref: '#/components/schemas/SchemaVersion'
        data:
          $ref: '#/components/schemas/AttributeSchema'
    AttributeSchemaDeleteResponse:
