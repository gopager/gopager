            total:
              type: integer
              minimum: 0
              description: Number of rows the caller may read, independent of paging.
    CreateAddressRuleRequest:
      type: object
      description: '`id` must not be sent.'
      required:
      - schemaVersion
      - commandId
      - networkId
      - unitId
      - protocol
      - selector
      - enabled
      properties:
        schemaVersion:
          $ref: '#/components/schemas/SchemaVersion'
        commandId:
          type: string
          format: uuid
          description: Client-generated idempotency key (not the nil UUID). Receipts are stored per (caller principal,
            commandId) and never expire.
        expectedRevision:
          type: string
          enum:
          - '0'
          description: Optional on create; only "0" is accepted.
        networkId:
          type: string
          format: uuid
        unitId:
          type: string
          format: uuid
        protocol:
          $ref: '#/components/schemas/Protocol'
        selector:
          $ref: '#/components/schemas/Selector'
        validFrom:
          type: string
          format: date-time
          nullable: true
          description: Inclusive start (microsecond precision, years 0–9999). Null means unbounded.
        validUntil:
          type: string
          format: date-time
          nullable: true
          description: Exclusive end; must be after `validFrom`. Null means unbounded.
        enabled:
          type: boolean
      additionalProperties: false
    UpdateAddressRuleRequest:
      type: object
      description: '`id` and `commandId` must not be sent.'
      required:
      - schemaVersion
      - expectedRevision
      - networkId
      - unitId
      - protocol
      - selector
      - enabled
      properties:
        schemaVersion:
          $ref: '#/components/schemas/SchemaVersion'
        expectedRevision:
          $ref: '#/components/schemas/Revision'
        networkId:
          type: string
          format: uuid
        unitId:
          type: string
          format: uuid
        protocol:
          $ref: '#/components/schemas/Protocol'
        selector:
          $ref: '#/components/schemas/Selector'
        validFrom:
          type: string
          format: date-time
          nullable: true
          description: Inclusive start (microsecond precision, years 0–9999). Null means unbounded.
        validUntil:
          type: string
          format: date-time
          nullable: true
          description: Exclusive end; must be after `validFrom`. Null means unbounded.
        enabled:
          type: boolean
      additionalProperties: false
    PreviewAddressRuleRequest:
      type: object
      description: '`commandId` must not be sent.'
      required:
      - schemaVersion
      - networkId
      - unitId
      - protocol
      - selector
      - enabled
      properties:
        schemaVersion:
          $ref: '#/components/schemas/SchemaVersion'
        id:
          type: string
          format: uuid
          description: Rule to validate as an update. Requires `expectedRevision`.
        expectedRevision:
          type: string
          pattern: ^(0|[1-9][0-9]*)$
          description: Required (positive) together with `id`; absent or "0" without it.
        networkId:
          type: string
          format: uuid
        unitId:
          type: string
          format: uuid
        protocol:
          $ref: '#/components/schemas/Protocol'
        selector:
          $ref: '#/components/schemas/Selector'
        validFrom:
          type: string
          format: date-time
          nullable: true
          description: Inclusive start (microsecond precision, years 0–9999). Null means unbounded.
        validUntil:
          type: string
          format: date-time
          nullable: true
          description: Exclusive end; must be after `validFrom`. Null means unbounded.
        enabled:
          type: boolean
      additionalProperties: false
    Suppression:
      type: object
      required:
      - id
      - revision
      - transmissionId
      - targetPosition
      - active
      - createdAt
      - liftedAt
      properties:
        id:
          type: string
          format: uuid
        revision:
          $ref: '#/components/schemas/Revision'
        transmissionId:
          type: string
          format: uuid
        targetPosition:
          type: integer
          minimum: 0
        active:
          type: boolean
        createdAt:
          type: string
          format: date-time
        liftedAt:
          type: string
          format: date-time
          nullable: true
    SuppressionResponse:
      type: object
      required:
      - schemaVersion
      - data
      properties:
        schemaVersion:
          $ref: '#/components/schemas/SchemaVersion'
        data:
          $ref: '#/components/schemas/Suppression'
    SuppressionPageResponse:
      type: object
      required:
      - schemaVersion
      - data
      properties:
        schemaVersion:
          $ref: '#/components/schemas/SchemaVersion'
        data:
          type: object
          required:
          - items
          - total
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Suppression'
            total:
              type: integer
              minimum: 0
              description: Number of rows the caller may read, independent of paging.
    CreateSuppressionRequest:
      type: object
      description: '`expectedAssignmentRevision` is the current global assignment revision (see `assignmentRevision`
        in suppression and correction responses).'
      required:
      - schemaVersion
      - commandId
      - expectedAssignmentRevision
      - transmissionId
      - targetPosition
      properties:
        schemaVersion:
          $ref: '#/components/schemas/SchemaVersion'
        commandId:
          type: string
          format: uuid
          description: Client-generated idempotency key (not the nil UUID). Receipts are stored per (caller principal,
            commandId) and never expire.
        expectedAssignmentRevision:
          $ref: '#/components/schemas/Revision'
        transmissionId:
          type: string
          format: uuid
        targetPosition:
          type: integer
          minimum: 0
      additionalProperties: false
    LiftSuppressionRequest:
      type: object
      required:
      - schemaVersion
      - expectedRevision
      - expectedAssignmentRevision
      properties:
        schemaVersion:
          $ref: '#/components/schemas/SchemaVersion'
        expectedRevision:
          $ref: '#/components/schemas/Revision'
        expectedAssignmentRevision:
          $ref: '#/components/schemas/Revision'
      additionalProperties: false
    SuppressionCommandResponse:
      type: object
      required:
      - schemaVersion
      - data
      properties:
        schemaVersion:
          $ref: '#/components/schemas/SchemaVersion'
        data:
          type: object
          required:
          - id
          - revision
          - status
          - correctionId
          - assignmentRevision
          properties:
            id:
              type: string
              format: uuid
            revision:
              $ref: '#/components/schemas/Revision'
            status:
              type: string
              enum:
              - pending
            correctionId:
              type: string
              format: uuid
              description: Follow with GET /assignment-corrections/{id}.
            assignmentRevision:
              $ref: '#/components/schemas/Revision'
    Correction:
      type: object
      required:
      - id
      - assignmentRevision
      - state
      - networkCount
      - unitCount
      - processed
      - remaining
      properties:
        id:
          type: string
          format: uuid
        assignmentRevision:
          $ref: '#/components/schemas/Revision'
        state:
          type: string
          enum:
          - pending
          - running
          - completed
          - failed
          - superseded
        networkCount:
          type: integer
          minimum: 0
        unitCount:
          type: integer
          minimum: 0
        processed:
          type: integer
          minimum: 0
        remaining:
          type: integer
          minimum: 0
        failureCode:
          type: string
          description: Platform error code of the last failure. Omitted when there is none.
    CorrectionResponse:
      type: object
      required:
      - schemaVersion
      - data
      properties:
        schemaVersion:
          $ref: '#/components/schemas/SchemaVersion'
        data:
          $ref: '#/components/schemas/Correction'
    RetryCorrectionRequest:
      type: object
      required:
      - schemaVersion
      - commandId
      properties:
        schemaVersion:
          $ref: '#/components/schemas/SchemaVersion'
        commandId:
          type: string
          format: uuid
          description: Client-generated idempotency key (not the nil UUID). Receipts are stored per (caller principal,
            commandId) and never expire.
      additionalProperties: false
    TransmissionTarget:
      type: object
      required:
      - address
      properties:
        address:
          oneOf:
          - type: integer
            format: int64
            minimum: 0
            description: POCSAG (0–2097151) and FLEX (supported address classes).
          - type: string
            pattern: ^[0-9]{5,6}$
            description: ZVEI (5 digits) and EAS (6 digits); leading zeros preserved.
        function:
          type: integer
          minimum: 0
          maximum: 3
          description: Required for POCSAG, forbidden otherwise. Must not be null.
      additionalProperties: false
    Payload:
      description: Closed, protocol-specific payload. Exactly the listed members are allowed per form; duplicate
        keys and nulls are rejected.
      oneOf:
      - type: object
        description: POCSAG, FLEX.
        required:
        - form
        - value
        properties:
          form:
            type: string
            enum:
            - text
          value:
            type: string
        additionalProperties: false
      - type: object
        description: POCSAG, FLEX.
        required:
        - form
        - value
        properties:
          form:
            type: string
            enum:
            - numeric
          value:
            type: string
            pattern: ^[0-9.U ()-]*$
        additionalProperties: false
      - type: object
        description: POCSAG, FLEX.
        required:
        - form
        properties:
          form:
            type: string
            enum:
            - tone-only
        additionalProperties: false
      - type: object
        description: FLEX only.
        required:
        - form
        - subtype
        - encoding
        - data
        properties:
          form:
            type: string
            enum:
            - binary
          subtype:
            type: string
            enum:
            - transparent
            - secure
          encoding:
            type: string
            enum:
            - base64
          data:
            type: string
            format: byte
            description: Canonical standard Base64 with padding.
        additionalProperties: false
      - type: object
        description: FLEX only.
        required:
        - form
        - sourceCode
        properties:
          form:
            type: string
            enum:
            - flex-short-signal
          sourceCode:
            type: integer
            minimum: 0
            maximum: 7
        additionalProperties: false
      - type: object
        description: ZVEI only. `double_tone` is null or a non-blank name.
        required:
        - form
        - double_tone
        properties:
          form:
            type: string
            enum:
            - zvei-signal
          double_tone:
            type: string
            nullable: true
            pattern: \S
        additionalProperties: false
      - type: object
        description: EAS only.
        required:
        - form
        - originator
        - eventCode
        - purgeTime
        - issueTime
        properties:
          form:
            type: string
            enum:
            - eas-header
          originator:
            type: string
            pattern: ^[A-Z0-9]{3}$
          eventCode:
            type: string
            pattern: ^[A-Z0-9]{3}$
          purgeTime:
            type: string
            pattern: ^[0-9]{2}[0-5][0-9]$
            description: HHMM duration.
          issueTime:
            type: string
            pattern: ^[0-9]{7}$
            description: JJJHHMM (day 001–366).
        additionalProperties: false
    Submission:
      type: object
      description: 'Closed object: unknown members, duplicate keys and nulls in required or optional members are
        400.'
      required:
      - schemaVersion
      - submissionId
      - protocol
      - observationTime
      - payload
      - transmissionTargets
      properties:
        schemaVersion:
          $ref: '#/components/schemas/SchemaVersion'
        submissionId:
          type: string
          minLength: 1
          maxLength: 128
          description: 1–128 bytes of UTF-8 without leading or trailing whitespace; idempotency key per Gateway.
        protocol:
          $ref: '#/components/schemas/Protocol'
        observationTime:
          type: string
          format: date-time
          description: RFC 3339 with any offset. Truncated to whole seconds (not rounded) for comparison and idempotency.
        gatewayNetworkIdentifier:
          type: string
          minLength: 1
          maxLength: 128
          description: Gateway-local Network identifier. Omit instead of null.
        payload:
          $ref: '#/components/schemas/Payload'
        transmissionTargets:
          type: array
          maxItems: 1024
          items:
            $ref: '#/components/schemas/TransmissionTarget'
          description: ZVEI requires at least one target; EAS 1–31 targets.
        qualityMetrics:
          description: Any non-null JSON value. Omit instead of null.
        incomplete:
          type: boolean
          description: Omitted means false. Omit instead of null.
      additionalProperties: false
    Receipt:
      type: object
      required:
      - submissionId
      - transmissionId
      - acceptanceTime
      - processingStatus
      - messageId
      properties:
        submissionId:
          type: string
        transmissionId:
          type: string
          format: uuid
        acceptanceTime:
          type: string
          format: date-time
        processingStatus:
          type: string
          description: none when no Workflow was selected, pending while Workflow candidates are open, else
            completed or failed (derived from the candidates of the currently selected Workflows).
          enum:
          - none
          - pending
          - completed
          - failed
        messageId:
          type: string
          format: uuid
    ReceiptResponse:
      type: object
      required:
      - schemaVersion
      - data
      properties:
        schemaVersion:
          $ref: '#/components/schemas/SchemaVersion'
        data:
          $ref: '#/components/schemas/Receipt'
    GatewayStateReport:
      description: Closed object; unknown or duplicate members and nulls are 400.
      oneOf:
      - type: object
        required:
        - schemaVersion
        - operation
        properties:
          schemaVersion:
            $ref: '#/components/schemas/SchemaVersion'
          operation:
            type: string
            enum:
            - heartbeat
            - recovered
            - terminated
        additionalProperties: false
      - type: object
        required:
        - schemaVersion
        - operation
        - reasonCode
        properties:
          schemaVersion:
            $ref: '#/components/schemas/SchemaVersion'
          operation:
            type: string
            enum:
            - degraded
          reasonCode:
            type: string
            minLength: 1
            maxLength: 64
            pattern: ^[!-~]+$
            description: 1–64 bytes of printable ASCII without spaces.
          detail:
            type: string
            maxLength: 512
            description: At most 512 bytes of UTF-8.
        additionalProperties: false
    GatewayNetworkAssignment:
      type: object
      required:
      - gatewayNetworkIdentifier
      - networkId
      properties:
        gatewayNetworkIdentifier:
          type: string
          minLength: 1
          maxLength: 128
          pattern: \S
          description: 1–128 bytes of non-blank UTF-8, unique within the set.
        networkId:
          type: string
          format: uuid
        default:
          type: boolean
          default: false
          description: Default Network for its protocol; exactly one per protocol in the set.
      additionalProperties: false
    ReplaceGatewayNetworksRequest:
      type: object
      required:
      - schemaVersion
      - expectedRevision
      - networks
      properties:
        schemaVersion:
          $ref: '#/components/schemas/SchemaVersion'
        expectedRevision:
          $ref: '#/components/schemas/Revision'
        networks:
          type: array
          minItems: 1
          maxItems: 1024
          items:
            $ref: '#/components/schemas/GatewayNetworkAssignment'
      additionalProperties: false
    GatewayCredentialCommandRequest:
      type: object
      description: '`expectedRevision` is the Gateway revision.'
      required:
      - schemaVersion
      - commandId
      - expectedRevision
      properties:
        schemaVersion:
          $ref: '#/components/schemas/SchemaVersion'
        commandId:
          type: string
          format: uuid
          description: Client-generated idempotency key (not the nil UUID). Receipts are stored per (caller principal,
            commandId) and never expire.
        expectedRevision:
          $ref: '#/components/schemas/Revision'
      additionalProperties: false
    GatewayRevisionResponse:
      type: object
      description: Unwrapped (no `data` envelope).
      required:
      - schemaVersion
      - revision
      properties:
        schemaVersion:
          $ref: '#/components/schemas/SchemaVersion'
        revision:
          $ref: '#/components/schemas/Revision'
    GatewayCredentialIssueResponse:
      type: object
      description: Unwrapped (no `data` envelope).
      required:
      - schemaVersion
      - credentialId
      - status
      - revision
      properties:
        schemaVersion:
          $ref: '#/components/schemas/SchemaVersion'
        credentialId:
          type: string
          format: uuid
        secret:
          type: string
          pattern: ^[A-Za-z0-9_-]{43}$
          description: Bearer secret (unpadded base64url, 256 bits). Returned once; omitted on replay.
        status:
          type: string
          enum:
          - current
          - pending
          - revoked
          description: '`current` or `pending` on first issue; on replay the credential''s current status.'
        revision:
          $ref: '#/components/schemas/Revision'
    GatewayCredential:
      type: object
      required:
      - credentialId
      - status
      - createdAt
      properties:
        credentialId:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - current
          - pending
          - revoked
        createdAt:
          type: string
          format: date-time
        lastUsedAt:
          type: string
          format: date-time
          description: Omitted when never used.
        revokedAt:
          type: string
          format: date-time
          description: Omitted unless revoked.
    GatewayCredentialListResponse:
      type: object
      description: Unwrapped (no `data` envelope).
      required:
      - schemaVersion
      - credentials
      properties:
        schemaVersion:
          $ref: '#/components/schemas/SchemaVersion'
        credentials:
          type: array
          items:
            $ref: '#/components/schemas/GatewayCredential'
    ValueKind:
      type: string
      enum:
      - string
      - boolean
      - integer
      - number
      - timestamp
      - bytes
      - object
      - list
      - 'null'
    FieldRef:
      type: object
      description: Reference to a declared field; never expression text.
      required:
      - namespace
      - path
      properties:
        namespace:
          type: string
          enum:
          - source
          - target
          - step
        path:
          type: array
          minItems: 1
          maxItems: 32
          items:
            type: string
            minLength: 1
            description: UTF-8 without NUL.
      additionalProperties: false
    FieldSchema:
      type: object
      description: Closed field type; nests at most 32 levels.
      required:
      - kind
      properties:
        kind:
          type: string
          enum:
          - string
          - boolean
          - integer
          - number
          - timestamp
          - bytes
          - object
          - list
        optional:
          type: boolean
          description: The field may be absent (distinct from null).
        nullable:
          type: boolean
          description: The value may be explicit null.
        properties:
          type: object
          maxProperties: 1000
          additionalProperties:
            $ref: '#/components/schemas/FieldSchema'
          description: Only for `object`.
        element:
          allOf:
          - $ref: '#/components/schemas/FieldSchema'
          description: Required for `list`, forbidden otherwise.
      additionalProperties: false
    TypedValue:
      type: object
      required:
      - kind
      - value
      properties:
        kind:
          $ref: '#/components/schemas/ValueKind'
        value:
          description: 'Encoding by kind: string → JSON string; boolean → JSON boolean; integer → decimal string
            (int64); number → finite JSON number; timestamp → RFC 3339 string with offset; bytes → canonical padded
            Base64; object → map of typed values; list → array of typed values (≤ 1000); null → null.'
      additionalProperties: false
    Assignment:
      type: object
      description: Exactly one of `field` and `literal`.
      properties:
        field:
          $ref: '#/components/schemas/FieldRef'
        literal:
          $ref: '#/components/schemas/TypedValue'
        conversion:
          type: string
          enum:
          - string
          - boolean
          - integer
          - number
          - timestamp
          - bytes
          - object
          - list
          description: Optional; must equal the target schema kind.
      additionalProperties: false
    Predicate:
      type: object
      description: Typed predicate tree compiled to a checked CEL program. `and`/`or` take `args` (`not` exactly
        one); `present` takes `field` and a boolean `value`; `in` takes `field` and `values`; the comparisons take
        `field` and `value`. Nests at most 32 levels.
      required:
      - op
      properties:
        op:
          type: string
          enum:
          - and
          - or
          - not
          - present
          - eq
          - in
          - lt
          - lte
          - gt
          - gte
          - contains
        field:
          $ref: '#/components/schemas/FieldRef'
        value:
          $ref: '#/components/schemas/TypedValue'
        values:
          type: array
          minItems: 1
          maxItems: 1024
          items:
            $ref: '#/components/schemas/TypedValue'
        args:
          type: array
          minItems: 1
          maxItems: 1024
          items:
            $ref: '#/components/schemas/Predicate'
      additionalProperties: false
    ExtractStep:
      type: object
      required:
      - input
      - pattern
      - captures
      properties:
        input:
          $ref: '#/components/schemas/FieldRef'
        pattern:
          type: string
          description: Core regular expression.
        captures:
          type: object
          additionalProperties:
            type: object
            required:
            - name
            properties:
              name:
                type: string
                description: Named capture group; must occur exactly once.
              conversion:
                type: string
                enum:
                - string
                - integer
                - number
                - boolean
                - timestamp
            additionalProperties: false
      additionalProperties: false
    BranchStep:
      type: object
      required:
      - condition
      - thenOutputs
      - elseOutputs
      properties:
        condition:
          $ref: '#/components/schemas/Predicate'
        then:
          type: array
          items:
            $ref: '#/components/schemas/Step'
        else:
          type: array
          items:
            $ref: '#/components/schemas/Step'
        thenOutputs:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/Assignment'
        elseOutputs:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/Assignment'
      additionalProperties: false
    InstalledStep:
      type: object
      description: Runs a configured plugin instance revision.
      required:
      - instanceId
      - configurationRevision
      - input
      properties:
        instanceId:
          type: string
          format: uuid
        configurationRevision:
          $ref: '#/components/schemas/Revision'
        input:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/Assignment'
      additionalProperties: false
    Step:
      type: object
      description: Only the configuration member matching `kind` may be set.
      required:
      - id
      - kind
      - outputSchema
      properties:
        id:
          type: string
          minLength: 1
          description: UTF-8 without NUL; unique across the whole definition.
        kind:
          type: string
          enum:
          - map
          - extract
          - branch
          - installed
        outputSchema:
          type: object
          maxProperties: 1000
          additionalProperties:
            $ref: '#/components/schemas/FieldSchema'
        map:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/Assignment'
        extract:
          $ref: '#/components/schemas/ExtractStep'
        branch:
          $ref: '#/components/schemas/BranchStep'
        installed:
          $ref: '#/components/schemas/InstalledStep'
      additionalProperties: false
    Definition:
      type: object
      description: 'Workflow definition. Full semantics: docs/workflows.md.'
      required:
      - schemaVersion
      - selector
      - outputSchema
      - outputs
      properties:
        schemaVersion:
          $ref: '#/components/schemas/SchemaVersion'
        selector:
          $ref: '#/components/schemas/Predicate'
        steps:
          type: array
          maxItems: 128
          items:
            $ref: '#/components/schemas/Step'
          description: At most 128 steps in total, nested branch steps included.
        outputSchema:
          type: object
          maxProperties: 1000
          additionalProperties:
            $ref: '#/components/schemas/FieldSchema'
        outputs:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/Assignment'
      additionalProperties: false
    WorkflowScope:
      type: object
      required:
      - kind
      properties:
        kind:
          type: string
          enum:
          - all
          - network
          - unit
        references:
          type: array
          minItems: 1
          maxItems: 1024
          uniqueItems: true
          items:
            type: string
            format: uuid
          description: Required for `network` and `unit`, forbidden for `all`. Returned normalized and sorted.
      additionalProperties: false
    Workflow:
      type: object
      required:
      - id
      - revision
      - name
      - scope
      - enabled
      - createdAt
      - updatedAt
      properties:
        id:
          type: string
          format: uuid
        revision:
          $ref: '#/components/schemas/Revision'
        name:
          type: string
        scope:
          $ref: '#/components/schemas/WorkflowScope'
        enabled:
          type: boolean
        activeVersionId:
          type: string
          format: uuid
          description: Omitted when no version is active.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    WorkflowResponse:
      type: object
      required:
      - schemaVersion
      - data
      properties:
        schemaVersion:
          $ref: '#/components/schemas/SchemaVersion'
        data:
