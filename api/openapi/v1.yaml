          format: uuid
        state:
          type: string
          enum:
          - started
          - accepted
          - transient
          - permanent
          - uncertain
        outcomeCode:
          $ref: '#/components/schemas/DeliveryOutcomeCode'
        instanceRevision:
          $ref: '#/components/schemas/Revision'
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
        receipt:
          description: Bounded JSON (at most 4 KiB) the target provider deems safe to show.
    Delivery:
      type: object
      description: Inspectable state of one Delivery. The rendered input and authorization context are never part of it.
      required:
      - id
      - revision
      - origin
      - subscriptionId
      - subscriptionRevision
      - subscriberId
      - domainEventId
      - eventType
      - targetInstanceId
      - splitKey
      - state
      - attemptCount
      - layoutVersion
      - expiresAt
      - createdAt
      - updatedAt
      properties:
        id:
          type: string
          format: uuid
        revision:
          $ref: '#/components/schemas/Revision'
        origin:
          type: string
          enum:
          - automatic
          - redelivery
        redeliveryOf:
          type: string
          format: uuid
          description: The Delivery a redelivery repeats.
        subscriptionId:
          type: string
          format: uuid
        subscriptionRevision:
          $ref: '#/components/schemas/Revision'
        subscriberId:
          type: string
          format: uuid
        domainEventId:
          type: string
          format: uuid
        eventType:
          type: string
        targetInstanceId:
          type: string
          format: uuid
        splitKey:
          type: string
          description: The Unit ID of a split Delivery, empty otherwise.
        state:
          $ref: '#/components/schemas/DeliveryState'
        outcomeCode:
          $ref: '#/components/schemas/DeliveryOutcomeCode'
        attemptCount:
          type: integer
          minimum: 0
        layoutId:
          type: string
          format: uuid
        layoutVersion:
          type: string
          pattern: ^(0|[1-9][0-9]*)$
          description: 0 for the built-in layout.
        messageId:
          type: string
          format: uuid
        nextAttemptAt:
          type: string
          format: date-time
          description: Only while the Delivery is open and not started.
        expiresAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
        attempts:
          type: array
          items:
            $ref: '#/components/schemas/DeliveryAttempt'
          description: Only on single-Delivery reads and command results.
    DeliveryResponse:
      type: object
      required:
      - schemaVersion
      - data
      properties:
        schemaVersion:
          $ref: '#/components/schemas/SchemaVersion'
        data:
          $ref: '#/components/schemas/Delivery'
    DeliveryPageResponse:
      type: object
      required:
      - schemaVersion
      - data
      properties:
        schemaVersion:
          $ref: '#/components/schemas/SchemaVersion'
        data:
          type: object
          required:
          - items
          - total
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Delivery'
            total:
              type: integer
              minimum: 0
    RetryDeliveryRequest:
      type: object
      required:
      - schemaVersion
      - expectedRevision
      properties:
        schemaVersion:
          $ref: '#/components/schemas/SchemaVersion'
        expectedRevision:
          $ref: '#/components/schemas/Revision'
      additionalProperties: false
    RedeliverDeliveryRequest:
      type: object
      required:
      - schemaVersion
      - commandId
      - confirmDuplicateRisk
      properties:
        schemaVersion:
          $ref: '#/components/schemas/SchemaVersion'
        commandId:
          type: string
          format: uuid
          description: Client-generated idempotency key (not the nil UUID).
        confirmDuplicateRisk:
          type: boolean
          enum:
          - true
          description: Acknowledges that the recipient may receive the content twice. `false` is 400.
      additionalProperties: false
    LayoutOutputKind:
      type: string
      description: '`text` renders plain lines, `markdown` Markdown with every interpolated value escaped (never HTML),
        `json` an array of typed items.'
      enum:
      - text
      - markdown
      - json
    LayoutUrl:
      type: object
      description: Link target built from a template and field values. The placeholders `{0}` to `{9}` index `fields`;
        every placeholder needs a field and every field must be used. Values are path-escaped; only `http`, `https`
        and `mailto` results render.
      required:
      - template
      - fields
      properties:
        template:
          type: string
          minLength: 1
          maxLength: 2048
        fields:
          type: array
          maxItems: 10
          items:
            $ref: '#/components/schemas/DeliveryFieldRef'
      additionalProperties: false
    LayoutBlock:
      type: object
      description: 'One element of a layout. `kind` selects the allowed properties: `text` takes `text`; `field` and
        `chip` take `field` and optional `label`; `link` takes `label` and `url`; `section` takes optional `title` and
        `blocks`; `conditional` takes `when`, `then` and optional `else`; `fallback` takes `blocks` (2 to 8
        alternatives, the first non-empty one renders). Any other property is 400.'
      required:
      - kind
      properties:
        kind:
          type: string
          enum:
          - text
          - field
          - chip
          - link
          - section
          - conditional
          - fallback
        text:
          type: string
          maxLength: 4096
        field:
          $ref: '#/components/schemas/DeliveryFieldRef'
        label:
          type: string
          maxLength: 256
        title:
          type: string
          maxLength: 256
        url:
          $ref: '#/components/schemas/LayoutUrl'
        when:
          $ref: '#/components/schemas/DeliveryPredicate'
        blocks:
          type: array
          items:
            $ref: '#/components/schemas/LayoutBlock'
        then:
          type: array
          items:
            $ref: '#/components/schemas/LayoutBlock'
        else:
          type: array
          items:
            $ref: '#/components/schemas/LayoutBlock'
      additionalProperties: false
    LayoutDefinition:
      type: object
      description: Declarative arrangement of typed fields for one output kind. It is data, not a template. At most 256
        blocks in total and 8 levels of nesting.
      required:
      - schemaVersion
      - outputKind
      - blocks
      properties:
        schemaVersion:
          $ref: '#/components/schemas/SchemaVersion'
        outputKind:
          $ref: '#/components/schemas/LayoutOutputKind'
        blocks:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/LayoutBlock'
      additionalProperties: false
    Layout:
      type: object
      required:
      - id
      - revision
      - name
      - outputKind
      - definition
      - agencies
      - createdAt
      - updatedAt
      properties:
        id:
          type: string
          format: uuid
        revision:
          $ref: '#/components/schemas/Revision'
        name:
          type: string
          minLength: 1
          maxLength: 256
        outputKind:
          $ref: '#/components/schemas/LayoutOutputKind'
        definition:
          $ref: '#/components/schemas/LayoutDefinition'
        agencies:
          $ref: '#/components/schemas/AssignedAgencies'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    LayoutVersion:
