          format: date-time
        description: Inclusive lower bound of the Message time.
      - name: until
        in: query
        schema:
          type: string
          format: date-time
        description: Exclusive upper bound of the Message time.
      - name: text
        in: query
        schema:
          type: string
          maxLength: 1024
        description: Literal Unicode case-folded substring of the text or numeric Payload value. Empty means no filter.
      - name: unit
