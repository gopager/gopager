  /transmissions:
    post:
      operationId: submitTransmission
      tags:
      - Ingest
      summary: Submit one observed transmission
      description: |
        Gateway credential only; the Gateway identity is derived from the credential. The body is
        limited to 1 MiB. Idempotency is keyed on (Gateway, `submissionId`): an identical
        re-submission returns the stored receipt; different content under the same ID is 409
        `IDEMPOTENCY_CONFLICT`. Rejected submissions (400, 409, 413) create no transmission.
        Network resolution uses only the Gateway's Networks of the submission's protocol, in order:
        the declared `gatewayNetworkIdentifier` (unknown: 400 `INVALID_INPUT`), the only Network of
        the protocol, the only Network with an Address rule matching the targets at the observation
        time, the highest-priority of several matching Networks (this also appends the intake fact
        `operation.network-ambiguous`), and, when none matches (including targetless submissions),
        the highest-priority Network of the protocol. A Gateway without a Network of the protocol is
        400 `INVALID_INPUT`.
        The status is 202 while the receipt's `processingStatus` is `pending`, else 200. Accepted evidence
        is visible to readers in every case; Workflow results attach to the Message when they complete.
      security:
      - gatewayCredential: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Submission'
      responses:
        '202':
          description: Accepted; intake committed and `processingStatus` is `pending` (at least one Workflow
            candidate is open).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReceiptResponse'
        '200':
          description: Intake committed with `processingStatus` `none` (no Workflow selected), or a replay of
            an earlier submission whose `processingStatus` is `none`, `completed` or `failed`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReceiptResponse'
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        '413':
          $ref: '#/components/responses/ResourceLimit'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
