          - assignmentRevision
          properties:
            id:
              type: string
              format: uuid
            revision:
              $ref: '#/components/schemas/Revision'
            status:
              type: string
              enum:
              - pending
            correctionId:
              type: string
              format: uuid
              description: Follow with GET /assignment-corrections/{id}.
            assignmentRevision:
              $ref: '#/components/schemas/Revision'
    Correction:
      type: object
      required:
      - id
      - assignmentRevision
      - state
      - scope
      - processed
      - remaining
      - unresolved
      properties:
        id:
          type: string
          format: uuid
        assignmentRevision:
          $ref: '#/components/schemas/Revision'
        state:
          type: string
          enum:
          - pending
          - running
          - completed
          - failed
          - superseded
        scope:
          $ref: '#/components/schemas/CorrectionScope'
        processed:
          type: integer
          minimum: 0
          description: Transmissions with a target inside the scope that already carry the scope's revision or a newer one.
        remaining:
          type: integer
          minimum: 0
          description: Transmissions with a target inside the scope that still await re-resolution.
        unresolved:
          type: integer
          minimum: 0
          description: For kind `gateway`, Transmissions of the scope that the current mapping and rules cannot resolve;
            they keep their Network. Always 0 for other kinds.
        failureCode:
          type: string
          description: Platform error code of the last failure. Omitted when there is none.
    CorrectionScope:
      type: object
      description: The targets a correction re-resolves. Kind `address-rules` carries `networkId`, `protocol`
        and either an address range (`addressFrom`, `addressTo`) or an `addressText`, with an optional
        validity window; kind `unit` carries `unitId`; kind `target` carries `transmissionId` and `targetPosition`;
        kind `gateway` (a Network mapping change) carries `gatewayId` and `protocol` and re-resolves the Network
        of every Transmission of that Gateway and Protocol.
      required:
      - kind
      properties:
        kind:
          type: string
          enum:
          - address-rules
          - unit
          - target
          - gateway
        gatewayId:
          type: string
          format: uuid
        networkId:
          type: string
          format: uuid
        protocol:
          type: string
        addressFrom:
          type: integer
          minimum: 0
        addressTo:
          type: integer
          minimum: 0
        addressText:
          type: string
        validFrom:
          type: string
          format: date-time
        validUntil:
          type: string
          format: date-time
        unitId:
          type: string
          format: uuid
        transmissionId:
          type: string
          format: uuid
        targetPosition:
          type: integer
          minimum: 0
    CorrectionResponse:
      type: object
      required:
      - schemaVersion
      - data
      properties:
        schemaVersion:
          $ref: '#/components/schemas/SchemaVersion'
        data:
          $ref: '#/components/schemas/Correction'
    RetryCorrectionRequest:
      type: object
      required:
      - schemaVersion
      - commandId
      properties:
        schemaVersion:
          $ref: '#/components/schemas/SchemaVersion'
        commandId:
          type: string
          format: uuid
          description: Client-generated idempotency key (not the nil UUID). Receipts are stored per (caller principal,
            commandId) and never expire.
      additionalProperties: false
    TransmissionTarget:
      type: object
      required:
      - address
      properties:
        address:
          oneOf:
          - type: integer
            format: int64
            minimum: 0
            description: POCSAG (0–2097151) and FLEX (supported address classes).
          - type: string
            pattern: ^[0-9]{5,6}$
            description: ZVEI (5 digits) and EAS (6 digits); leading zeros preserved.
        function:
          type: integer
          minimum: 0
          maximum: 3
          description: Required for POCSAG, forbidden otherwise. Must not be null.
      additionalProperties: false
    Payload:
      description: Closed, protocol-specific payload. Exactly the listed members are allowed per form; duplicate
        keys and nulls are rejected.
      oneOf:
      - type: object
        description: POCSAG, FLEX.
        required:
        - form
        - value
        properties:
          form:
            type: string
            enum:
            - text
          value:
            type: string
        additionalProperties: false
      - type: object
        description: POCSAG, FLEX.
        required:
        - form
        - value
        properties:
          form:
            type: string
            enum:
            - numeric
          value:
            type: string
            pattern: ^[0-9.U ()-]*$
        additionalProperties: false
      - type: object
        description: POCSAG, FLEX.
        required:
        - form
        properties:
          form:
            type: string
            enum:
            - tone-only
        additionalProperties: false
      - type: object
        description: FLEX only.
        required:
        - form
        - subtype
        - encoding
        - data
        properties:
          form:
            type: string
            enum:
            - binary
          subtype:
            type: string
            enum:
            - transparent
            - secure
          encoding:
            type: string
            enum:
            - base64
          data:
            type: string
            format: byte
            description: Canonical standard Base64 with padding.
        additionalProperties: false
      - type: object
        description: FLEX only.
        required:
        - form
        - sourceCode
        properties:
          form:
            type: string
            enum:
            - flex-short-signal
          sourceCode:
            type: integer
            minimum: 0
            maximum: 7
        additionalProperties: false
      - type: object
        description: ZVEI only. `double_tone` is null or a non-blank name.
        required:
        - form
        - double_tone
        properties:
          form:
            type: string
            enum:
            - zvei-signal
          double_tone:
            type: string
            nullable: true
            pattern: \S
        additionalProperties: false
      - type: object
        description: EAS only.
        required:
        - form
        - originator
        - eventCode
        - purgeTime
        - issueTime
        properties:
          form:
            type: string
            enum:
            - eas-header
          originator:
            type: string
            pattern: ^[A-Z0-9]{3}$
          eventCode:
            type: string
            pattern: ^[A-Z0-9]{3}$
          purgeTime:
            type: string
            pattern: ^[0-9]{2}[0-5][0-9]$
            description: HHMM duration.
          issueTime:
            type: string
            pattern: ^[0-9]{7}$
            description: JJJHHMM (day 001–366).
        additionalProperties: false
    Submission:
      type: object
      description: 'Closed object: unknown members, duplicate keys and nulls in required or optional members are
        400.'
      required:
      - schemaVersion
      - submissionId
      - protocol
      - observationTime
      - payload
      - transmissionTargets
      properties:
        schemaVersion:
          $ref: '#/components/schemas/SchemaVersion'
        submissionId:
          type: string
          minLength: 1
          maxLength: 128
          description: 1–128 bytes of UTF-8 without leading or trailing whitespace; idempotency key per Gateway.
        protocol:
          $ref: '#/components/schemas/Protocol'
        observationTime:
          type: string
          format: date-time
          description: RFC 3339 with any offset. Truncated to whole seconds (not rounded) for comparison and idempotency.
        gatewayNetworkIdentifier:
          type: string
          minLength: 1
          maxLength: 128
          description: Gateway-local Network identifier. Omit instead of null.
        payload:
          $ref: '#/components/schemas/Payload'
        transmissionTargets:
          type: array
          maxItems: 1024
          items:
            $ref: '#/components/schemas/TransmissionTarget'
          description: ZVEI requires at least one target; EAS 1–31 targets.
        qualityMetrics:
          description: Any non-null JSON value. Omit instead of null.
        incomplete:
          type: boolean
          description: Omitted means false. Omit instead of null.
      additionalProperties: false
    Receipt:
      type: object
      required:
      - submissionId
      - transmissionId
      - acceptanceTime
      - processingStatus
      - messageId
      properties:
        submissionId:
          type: string
        transmissionId:
          type: string
          format: uuid
        acceptanceTime:
          type: string
          format: date-time
        processingStatus:
          type: string
          description: none when no Workflow was selected, pending while Workflow candidates are open, else
            completed or failed (derived from the candidates of the currently selected Workflows).
          enum:
          - none
          - pending
          - completed
          - failed
        messageId:
          type: string
          format: uuid
    ReceiptResponse:
      type: object
      required:
      - schemaVersion
      - data
      properties:
        schemaVersion:
          $ref: '#/components/schemas/SchemaVersion'
        data:
          $ref: '#/components/schemas/Receipt'
    GatewayStateReport:
      description: Closed object; unknown or duplicate members and nulls are 400.
      oneOf:
      - type: object
        required:
        - schemaVersion
        - operation
        properties:
          schemaVersion:
            $ref: '#/components/schemas/SchemaVersion'
          operation:
            type: string
            enum:
            - heartbeat
            - recovered
            - terminated
        additionalProperties: false
      - type: object
        required:
        - schemaVersion
        - operation
        - reasonCode
        properties:
          schemaVersion:
            $ref: '#/components/schemas/SchemaVersion'
          operation:
            type: string
            enum:
            - degraded
          reasonCode:
            type: string
            minLength: 1
            maxLength: 64
            pattern: ^[!-~]+$
            description: 1–64 bytes of printable ASCII without spaces.
          detail:
            type: string
            maxLength: 512
            description: At most 512 bytes of UTF-8.
        additionalProperties: false
    GatewayNetworkAssignment:
      type: object
      required:
