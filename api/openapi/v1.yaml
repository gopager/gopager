    InstancePageResponse:
      type: object
      required:
      - schemaVersion
      - data
      properties:
        schemaVersion:
          $ref: '#/components/schemas/SchemaVersion'
        data:
          type: object
          required:
          - items
          - total
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/InstanceSummary'
            total:
              type: integer
              minimum: 0
              description: Number of rows the caller may read, independent of paging.
    Error:
      type: object
      required:
      - schemaVersion
      - code
      - parameters
      - textKey
      - fallback
      - requestId
      - retryable
      properties:
        schemaVersion:
          $ref: '#/components/schemas/SchemaVersion'
        code:
          type: string
          enum:
          - INVALID_INPUT
          - LOGIN_REQUIRED
          - FORBIDDEN
          - NOT_FOUND
          - REVISION_CONFLICT
          - IDEMPOTENCY_CONFLICT
          - INCOMPATIBLE_VERSION
          - RESOURCE_LIMIT
          - RATE_LIMITED
          - STORAGE_UNAVAILABLE
          - AUTHORITY_UNAVAILABLE
          - COMMIT_UNCERTAIN
          - INTERNAL_ERROR
          description: |
            Stable, language-independent code. HTTP status and `retryable` per code:
            `INVALID_INPUT` 400 (false); `LOGIN_REQUIRED` 401 (false); `FORBIDDEN` 403 (false);
            `NOT_FOUND` 404 (false); `REVISION_CONFLICT` 409 (true); `IDEMPOTENCY_CONFLICT` 409 (false);
            `INCOMPATIBLE_VERSION` 409 (false); `RESOURCE_LIMIT` 413 (false); `RATE_LIMITED` 429 (true);
            `STORAGE_UNAVAILABLE` 503 (true); `AUTHORITY_UNAVAILABLE` 503 (true); `COMMIT_UNCERTAIN` 503
            (false; the write may have committed, so re-send with the same `commandId`/`submissionId` or read
            the resource); `INTERNAL_ERROR` 500 (false).
        parameters:
          type: object
          maxProperties: 0
          description: Currently always `{}`.
        textKey:
          type: string
          pattern: ^error\.[A-Z_]+$
          description: '`error.<code>`.'
        fallback:
          type: string
          description: Redacted English message; never contains internal causes.
        requestId:
          type: string
          format: uuid
          description: Fresh UUID per error response.
        retryable:
          type: boolean
        retryAfterSeconds:
          type: integer
          minimum: 1
          description: Only with `RATE_LIMITED`.
