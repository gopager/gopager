          type: integer
          format: int64
          minimum: 0
          maximum: 2097151
        to:
          type: integer
          format: int64
          minimum: 0
          maximum: 2097151
        mode:
          type: string
          enum:
          - function-bit
          - subaddress
        functions:
          type: array
          minItems: 1
          maxItems: 4
