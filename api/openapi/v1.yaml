            commandId) and never expire.
        expectedRevision:
          $ref: '#/components/schemas/Revision'
        definition:
          $ref: '#/components/schemas/Definition'
      additionalProperties: false
    PreviewRequest:
      type: object
      description: Exactly one of `versionId` and `definition`; exactly one of `syntheticJson` and `storedTransmissionId`.
      required:
      - schemaVersion
      properties:
        schemaVersion:
          $ref: '#/components/schemas/SchemaVersion'
        versionId:
          type: string
          format: uuid
          description: Saved version to evaluate.
        definition:
          $ref: '#/components/schemas/Definition'
        syntheticJson:
          description: Synthetic transmission document (any JSON, ≤ 1 MiB) whose `networkId` names a current Network of the same Protocol; see docs/workflows.md.
        storedTransmissionId:
          type: string
          format: uuid
      additionalProperties: false
    Dependency:
