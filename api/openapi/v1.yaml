  /deliveries/{id}:
    parameters:
    - $ref: '#/components/parameters/ID'
    get:
      operationId: readDelivery
      tags:
      - Deliveries
      summary: Read a Delivery
      description: |
        Requires `delivery.read` covering the Delivery. Returns the Delivery with its `attempts`. A Delivery outside the
        caller's read scope is 404.
      security:
      - sessionCookie: []
      - accessKey: []
      - {}
      responses:
        '200':
          description: The Delivery with its attempts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveryResponse'
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /deliveries/{id}/retry:
    parameters:
    - $ref: '#/components/parameters/ID'
    post:
      operationId: retryDelivery
      tags:
      - Deliveries
      summary: Retry a failed Delivery
      description: |
        Requires `delivery.retry` covering the Delivery. Makes a `failed` Delivery with outcome code `transient` or
        `retry-exhausted` due again before its expiry. A stale `expectedRevision`, any other state or outcome code, and a
        Delivery past its expiry are 409 `REVISION_CONFLICT`; an `uncertain` Delivery is 409 `EXTERNAL_UNCERTAIN` and can
        only be sent again by a confirmed redelivery. A caller who may read but not retry the Delivery gets 403; one who may
        not read it gets 404. Takes no `commandId`.
      security:
      - sessionCookie: []
        csrfToken: []
      - accessKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RetryDeliveryRequest'
      responses:
        '200':
          description: The Delivery after the retry was scheduled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveryResponse'
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/DeliveryConflict'
        '413':
          $ref: '#/components/responses/ResourceLimit'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /deliveries/{id}/redeliver:
    parameters:
    - $ref: '#/components/parameters/ID'
    post:
      operationId: redeliverDelivery
      tags:
      - Deliveries
      summary: Send a Delivery again
      description: |
        Requires `delivery.redeliver` covering the Delivery (403 when the caller may only read it, 404 when not even that).
        Creates a new Delivery with origin `redelivery` for the original's Subscription, Domain event, target and split,
        materialized under the subscriber's current authority and the Subscription's current content. `confirmDuplicateRisk`
        must be `true` (400 otherwise): the recipient may receive the content twice, and a provider acceptance cannot be
        recalled. The original must be in a terminal state, otherwise 409 `REVISION_CONFLICT`, as when its Subscription is
        paused. 409 `DEPENDENCY_UNAVAILABLE` when more than 24 hours passed since the original was created, or the
        Subscription, target, Domain event or readable data no longer exists. A target that became unavailable is 503
        `AUTHORITY_UNAVAILABLE` with `parameters.status` `unavailable` and `parameters.instanceId`. Takes one unit of the
        subscriber's sending admission (429 `RATE_LIMITED` with `Retry-After`). Idempotent per (caller, `commandId`): a replay
        returns the redelivery as it is now.
      security:
      - sessionCookie: []
        csrfToken: []
      - accessKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RedeliverDeliveryRequest'
      responses:
        '201':
          description: The new Delivery in state `prepared`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveryResponse'
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/DeliveryConflict'
        '413':
          $ref: '#/components/responses/ResourceLimit'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /attribute-schemas:
    get:
      operationId: listAttributeSchemas
      tags:
      - Attribute schemas
      summary: List Attribute schemas
      description: |
        A schema is listed when a right that picks or fills attributes reaches one of its Agencies: `message.read`,
        `workflow.read`, `presentation.manage`, `subscription.manage-own`, `subscription.manage-global`,
        `saved-view.manage-global`, `unit.update` or `attribute-schema.manage`. Grant scope `all` and `account` show every
        schema, `agency` the schemas of that Agency, `unit` and `unitCollection` those of the Agency of the Units. Ordered by
        key; offset paging; `agency` narrows to one Agency; any other query parameter is 400. Without any such right the
        response is 403.
      security:
      - sessionCookie: []
      - accessKey: []
      - {}
      parameters:
      - $ref: '#/components/parameters/Offset'
      - $ref: '#/components/parameters/Limit'
      - name: agency
        in: query
        required: false
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: A page of schemas.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttributeSchemaPageResponse'
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    post:
      operationId: createAttributeSchema
      tags:
      - Attribute schemas
      summary: Create an Attribute schema
      description: |
        Requires `attribute-schema.manage` in every Agency of the schema. The key is the identifier and immutable; field
        names, types, labels, icons and limits are validated (400 `INVALID_INPUT`, 413 `RESOURCE_LIMIT`). An existing key is
        409 `REVISION_CONFLICT`; an unknown Agency is 400. Idempotent per (caller, `commandId`): an identical replay returns
        the schema as it is now (404 if deleted since).
      security:
      - sessionCookie: []
        csrfToken: []
      - accessKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAttributeSchemaRequest'
      responses:
        '201':
          description: The created schema at revision 1.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttributeSchemaResponse'
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/RevisionConflict'
        '413':
          $ref: '#/components/responses/ResourceLimit'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /attribute-schemas/{key}:
    parameters:
    - name: key
      in: path
      required: true
      schema:
        type: string
        pattern: '^[a-z][a-z0-9-]*$'
        maxLength: 64
    get:
      operationId: readAttributeSchema
      tags:
      - Attribute schemas
      summary: Read an Attribute schema
      description: Same visibility as the list; a schema in no visible Agency is 404.
      security:
      - sessionCookie: []
      - accessKey: []
      - {}
      responses:
        '200':
          description: The schema.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttributeSchemaResponse'
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    put:
      operationId: updateAttributeSchema
      tags:
      - Attribute schemas
      summary: Replace an Attribute schema
      description: |
        Requires `attribute-schema.manage` in every stored and every new Agency. Replaces label, description, fields,
        deprecation and Agencies at `expectedRevision` (stale: 409). Only compatible changes are accepted (400): fields and
        optional object properties may be added; nothing is removed; the subject and the type of existing fields do not
        change; labels, descriptions, icons and deprecation may change. Deprecation hides a schema or field from new
        references while stored values stay readable.
      security:
      - sessionCookie: []
        csrfToken: []
      - accessKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAttributeSchemaRequest'
      responses:
        '200':
          description: The schema at its new revision.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttributeSchemaResponse'
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/RevisionConflict'
        '413':
          $ref: '#/components/responses/ResourceLimit'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    delete:
      operationId: deleteAttributeSchema
      tags:
      - Attribute schemas
      summary: Delete an Attribute schema
      description: |
        Requires `attribute-schema.manage` in every Agency of the schema. A schema that an active Workflow version, a
        Layout, a Subscription filter or a saved view references is 409 `REVISION_CONFLICT`, like a stale revision.
      security:
      - sessionCookie: []
        csrfToken: []
      - accessKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteRequest'
      responses:
        '200':
          description: The deleted schema key and the revision it reached.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttributeSchemaDeleteResponse'
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/RevisionConflict'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /layouts:
    get:
      operationId: listLayouts
      tags:
      - Layouts
      summary: List layouts
      description: |
        A layout is listed when the caller holds `presentation.manage` or `message.read` in one of its Agencies (grant scope
        `all`, `agency`, or `unit`/`unitCollection` of a Unit of that Agency). Ordered by name then ID; offset paging, any
        other query parameter is 400. Without any such right the response is 403.
      security:
      - sessionCookie: []
      - accessKey: []
      - {}
      parameters:
      - $ref: '#/components/parameters/Offset'
      - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of layouts at their current version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LayoutPageResponse'
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    post:
      operationId: createLayout
      tags:
      - Layouts
      summary: Create a layout
      description: |
        Requires `presentation.manage` in every Agency of the layout; an unknown Agency is 400 `INVALID_INPUT`. The
        definition's structure, limits and field references are validated against the Delivery field catalog; an invalid definition is 400 `INVALID_INPUT`, a limit overrun 413 `RESOURCE_LIMIT`. The
        layout's output kind is the definition's and fixed at creation. Idempotent per (caller, `commandId`): an identical
        replay returns the layout as it is now (404 if deleted since).
      security:
      - sessionCookie: []
        csrfToken: []
      - accessKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateLayoutRequest'
      responses:
        '201':
          description: The created layout at revision 1 (version 1).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LayoutResponse'
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/RevisionConflict'
        '413':
          $ref: '#/components/responses/ResourceLimit'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /layouts/{id}:
    parameters:
    - $ref: '#/components/parameters/ID'
    get:
      operationId: readLayout
      tags:
      - Layouts
      summary: Read a layout
      description: |
        Same visibility as the list; a layout in no visible Agency is 404. Returns the layout at its current version.
      security:
      - sessionCookie: []
      - accessKey: []
      - {}
      responses:
        '200':
          description: The layout.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LayoutResponse'
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    put:
      operationId: updateLayout
      tags:
      - Layouts
      summary: Replace a layout
      description: |
        Requires `presentation.manage` in every Agency the layout has and in every Agency it will have. Replaces name,
        Agencies and definition at `expectedRevision` (stale: 409 `REVISION_CONFLICT`) and
        appends an immutable version whose number is the new revision. The definition's `outputKind` must equal the layout's
        (400). Subscriptions that reference the layout use the new version for Deliveries created afterwards.
      security:
      - sessionCookie: []
        csrfToken: []
      - accessKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateLayoutRequest'
      responses:
        '200':
          description: The layout at its new revision.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LayoutResponse'
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/RevisionConflict'
        '413':
          $ref: '#/components/responses/ResourceLimit'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    delete:
      operationId: deleteLayout
      tags:
      - Layouts
      summary: Delete a layout
      description: |
        Requires `presentation.manage` in every Agency of the layout. Removes the layout and its versions at `expectedRevision`. A layout that a
        Subscription still references is 409 `REVISION_CONFLICT`, like a stale revision.
      security:
      - sessionCookie: []
        csrfToken: []
      - accessKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteRequest'
      responses:
        '200':
          description: The deleted layout's ID and the revision it reached.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandResponse'
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/RevisionConflict'
        '413':
          $ref: '#/components/responses/ResourceLimit'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /layouts/{id}/versions/{version}:
    parameters:
    - $ref: '#/components/parameters/ID'
    - $ref: '#/components/parameters/LayoutVersionNumber'
    get:
      operationId: readLayoutVersion
      tags:
      - Layouts
      summary: Read a layout version
      description: |
        Same rights as the list. A version is immutable; its number is the layout revision that created it. A malformed
        version is 400, an unknown one 404.
      security:
      - sessionCookie: []
      - accessKey: []
      - {}
      responses:
        '200':
          description: The version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LayoutVersionResponse'
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: gopager_session
      description: |
        Browser session from POST /auth/login. A duplicate, empty or malformed cookie is 401 (no
        fallback to anonymous). It is ignored when an `Authorization` header is present. Session
        requests with a method other than GET, HEAD or OPTIONS must also send exactly one `Origin`
        header equal to the configured public origin and the `X-CSRF-Token` header (see
        `csrfToken`); otherwise 403 `FORBIDDEN`. Lifetime: 30 days absolute, 7 days idle.
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: |
        The session's `csrfToken` (from login or GET /auth/session). Required, together with a
        matching `Origin` header, on unsafe methods authenticated by `sessionCookie`. Not used with
        bearer or anonymous requests.
    accessKey:
      type: http
      scheme: bearer
      description: |
        Access key of a non-guest account: exactly one `Authorization: Bearer <secret>` header, the
        secret being 43 characters of unpadded base64url (256 bits). Anything else is 401. The key's
        restrictions only narrow the owning account's rights. The API has no endpoint that issues
        access keys. Requests without any credential run as the guest account (401 if none exists).
    gatewayCredential:
      type: http
      scheme: bearer
      description: |
        Gateway credential (same secret format as access keys), issued via
        POST /gateways/{id}/credentials. Only accepted by POST /transmissions and POST /gateway/state;
        missing, malformed, unknown or revoked credentials are 401. The first request with a pending
        credential promotes it to current and revokes the previous one.
  parameters:
    ID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Resource ID (not the nil UUID); a malformed value is 400.
    CredentialID:
      name: credentialId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    VersionID:
      name: version
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Workflow version ID.
    CandidateID:
      name: candidate
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Processing candidate ID.
    Offset:
      name: offset
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    LayoutVersionNumber:
      name: version
      in: path
      required: true
      schema:
        type: string
        pattern: ^[1-9][0-9]*$
      description: Layout version number (the layout revision that created it); a malformed value is 400.
    OriginHeader:
      name: Origin
      in: header
      required: true
      schema:
        type: string
      description: Exactly one value, equal to the configured public origin after normalization (lower-cased host,
        IDN to ASCII, default port dropped).
  responses:
    InvalidInput:
      description: Malformed body, wrong media type, unknown field, bad UUID or paging parameter, or an invalid
        value.
      content:
        application/json:
          schema:
            allOf:
            - $ref: '#/components/schemas/Error'
            - type: object
              properties:
                code:
                  type: string
                  enum:
                  - INVALID_INPUT
    Unauthorized:
      description: No valid credential, or the credential expired or was revoked.
      content:
        application/json:
          schema:
            allOf:
            - $ref: '#/components/schemas/Error'
            - type: object
              properties:
                code:
                  type: string
                  enum:
                  - LOGIN_REQUIRED
    Forbidden:
      description: Not permitted, or a failed Origin/CSRF check.
      content:
        application/json:
          schema:
            allOf:
            - $ref: '#/components/schemas/Error'
            - type: object
              properties:
                code:
                  type: string
                  enum:
                  - FORBIDDEN
    NotFound:
      description: Absent, deleted, or outside the caller's read scope (indistinguishable).
      content:
        application/json:
          schema:
            allOf:
            - $ref: '#/components/schemas/Error'
            - type: object
              properties:
                code:
                  type: string
                  enum:
                  - NOT_FOUND
    RevisionConflict:
      description: '`REVISION_CONFLICT` (retryable): stale expected revision or a conflicting configuration; reload
        before retrying. `IDEMPOTENCY_CONFLICT` (not retryable): `commandId` reused by the same caller with a different
        operation or input.'
      content:
        application/json:
          schema:
            allOf:
            - $ref: '#/components/schemas/Error'
            - type: object
              properties:
                code:
                  type: string
                  enum:
                  - REVISION_CONFLICT
                  - IDEMPOTENCY_CONFLICT
    VersionConflict:
      description: Revision or idempotency conflict as above, or an incompatible plugin manifest version.
      content:
        application/json:
          schema:
            allOf:
            - $ref: '#/components/schemas/Error'
            - type: object
              properties:
                code:
                  type: string
                  enum:
                  - REVISION_CONFLICT
                  - IDEMPOTENCY_CONFLICT
                  - INCOMPATIBLE_VERSION
    IdempotencyConflict:
      description: '`submissionId` reused with different content.'
      content:
        application/json:
          schema:
            allOf:
            - $ref: '#/components/schemas/Error'
            - type: object
              properties:
                code:
                  type: string
                  enum:
                  - IDEMPOTENCY_CONFLICT
    ResourceLimit:
      description: Body or collection size limit exceeded, or revision counter exhausted.
      content:
        application/json:
          schema:
            allOf:
            - $ref: '#/components/schemas/Error'
            - type: object
              properties:
                code:
                  type: string
                  enum:
                  - RESOURCE_LIMIT
    RateLimited:
      description: Login attempts, Message searches or Delivery sending admission throttled. `retryAfterSeconds` matches
        `Retry-After`.
      content:
        application/json:
          schema:
            allOf:
            - $ref: '#/components/schemas/Error'
            - type: object
              properties:
                code:
                  type: string
                  enum:
                  - RATE_LIMITED
      headers:
        Retry-After:
          description: Seconds until the next attempt (for a search or a send, until its one-minute window ends).
          schema:
            type: integer
            minimum: 1
    DeliveryConflict:
      description: '`REVISION_CONFLICT` (retryable): stale revision or a state the command does not apply to.
        `IDEMPOTENCY_CONFLICT` (not retryable): `commandId` reused with a different operation or input.
        `EXTERNAL_UNCERTAIN` (not retryable): the external outcome of the Delivery is uncertain; send it again only by
        a confirmed redelivery. `DEPENDENCY_UNAVAILABLE` (not retryable): what a redelivery needs is gone or no longer
        readable for the subscriber.'
      content:
        application/json:
          schema:
            allOf:
            - $ref: '#/components/schemas/Error'
            - type: object
              properties:
                code:
                  type: string
                  enum:
                  - REVISION_CONFLICT
                  - IDEMPOTENCY_CONFLICT
                  - EXTERNAL_UNCERTAIN
                  - DEPENDENCY_UNAVAILABLE
    InternalError:
      description: Unexpected failure.
      content:
        application/json:
          schema:
            allOf:
            - $ref: '#/components/schemas/Error'
            - type: object
              properties:
                code:
                  type: string
                  enum:
                  - INTERNAL_ERROR
    ServiceUnavailable:
      description: Process not ready or shutting down (`AUTHORITY_UNAVAILABLE`, returned before any database access),
        a required component or Delivery target unavailable, storage unavailable, or an uncertain commit.
      content:
        application/json:
          schema:
            allOf:
            - $ref: '#/components/schemas/Error'
            - type: object
              properties:
                code:
                  type: string
                  enum:
                  - STORAGE_UNAVAILABLE
                  - AUTHORITY_UNAVAILABLE
                  - COMMIT_UNCERTAIN
  schemas:
    SchemaVersion:
      type: integer
      enum:
      - 1
    Revision:
      type: string
      pattern: ^[1-9][0-9]*$
      description: Positive revision as a decimal string (int64 range).
    Liveness:
      type: object
      required:
      - live
      properties:
        live:
          type: boolean
    Readiness:
      type: object
      required:
      - ready
      properties:
        ready:
          type: boolean
    LoginRequest:
      type: object
      required:
      - schemaVersion
      - username
      - password
      properties:
        schemaVersion:
          $ref: '#/components/schemas/SchemaVersion'
        username:
          type: string
          description: Compared after NFC normalization and case folding; leading or trailing whitespace is 400.
        password:
          type: string
          format: password
      additionalProperties: false
    LoginResponse:
      type: object
      required:
      - schemaVersion
      - sessionId
      - csrfToken
      - expiresAt
      properties:
        schemaVersion:
          $ref: '#/components/schemas/SchemaVersion'
        sessionId:
          type: string
          format: uuid
        csrfToken:
          type: string
          description: Send as `X-CSRF-Token` on unsafe session requests.
        expiresAt:
          type: string
          format: date-time
          description: Absolute session expiry (30 days after login); RFC 3339 with fractional seconds.
    SessionResponse:
      type: object
      required:
      - schemaVersion
      - principalId
      - sessionId
      - csrfToken
      - expiresAt
      properties:
        schemaVersion:
          $ref: '#/components/schemas/SchemaVersion'
        principalId:
          type: string
          format: uuid
        sessionId:
          type: string
          format: uuid
        csrfToken:
          type: string
        expiresAt:
          type: string
          format: date-time
          description: 'Effective expiry: the earlier of the absolute expiry and 7 days after the last authenticated
            use.'
    CommandResult:
      type: object
      description: Identifier and resulting revision of the created or changed item.
      required:
      - id
      - revision
      properties:
        id:
          type: string
          format: uuid
        revision:
          $ref: '#/components/schemas/Revision'
