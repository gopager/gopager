          type: string
          format: date-time
        lastUsedAt:
          type: string
          format: date-time
          description: Omitted when never used.
        revokedAt:
          type: string
          format: date-time
          description: Omitted unless revoked.
    GatewayCredentialListResponse:
      type: object
      description: Unwrapped (no `data` envelope).
      required:
      - schemaVersion
      - credentials
      properties:
        schemaVersion:
          $ref: '#/components/schemas/SchemaVersion'
        credentials:
          type: array
          items:
            $ref: '#/components/schemas/GatewayCredential'
    ValueKind:
      type: string
      enum:
      - string
      - boolean
      - integer
      - number
      - timestamp
      - bytes
      - object
      - list
      - 'null'
    FieldRef:
      type: object
      description: Reference to a declared field; never expression text.
      required:
      - namespace
      - path
      properties:
        namespace:
          type: string
          enum:
          - source
          - target
          - step
        path:
          type: array
          minItems: 1
          maxItems: 32
          items:
            type: string
            minLength: 1
            description: UTF-8 without NUL.
      additionalProperties: false
    FieldSchema:
      type: object
      description: Closed field type; nests at most 32 levels.
      required:
      - kind
      properties:
        kind:
          type: string
          enum:
          - string
          - boolean
          - integer
          - number
          - timestamp
          - bytes
          - object
          - list
        optional:
          type: boolean
          description: The field may be absent (distinct from null).
        nullable:
          type: boolean
          description: The value may be explicit null.
        properties:
          type: object
          maxProperties: 1000
          additionalProperties:
            $ref: '#/components/schemas/FieldSchema'
          description: Only for `object`.
        element:
          allOf:
          - $ref: '#/components/schemas/FieldSchema'
          description: Required for `list`, forbidden otherwise.
      additionalProperties: false
    TypedValue:
      type: object
      required:
      - kind
      - value
      properties:
        kind:
          $ref: '#/components/schemas/ValueKind'
        value:
          description: 'Encoding by kind: string → JSON string; boolean → JSON boolean; integer → decimal string
            (int64); number → finite JSON number; timestamp → RFC 3339 string with offset; bytes → canonical padded
            Base64; object → map of typed values; list → array of typed values (≤ 1000); null → null.'
      additionalProperties: false
    Assignment:
      type: object
      description: Exactly one of `field` and `literal`.
      properties:
        field:
          $ref: '#/components/schemas/FieldRef'
        literal:
          $ref: '#/components/schemas/TypedValue'
        conversion:
          type: string
          enum:
          - string
          - boolean
          - integer
          - number
          - timestamp
          - bytes
          - object
          - list
          description: Optional; must equal the target schema kind.
      additionalProperties: false
    Predicate:
      type: object
      description: Typed predicate tree compiled to a checked CEL program. `and`/`or` take `args` (`not` exactly
        one); `present` takes `field` and a boolean `value`; `in` takes `field` and `values`; the comparisons take
        `field` and `value`. Nests at most 32 levels.
      required:
      - op
      properties:
        op:
          type: string
          enum:
          - and
          - or
          - not
          - present
          - eq
          - in
          - lt
          - lte
          - gt
          - gte
          - contains
        field:
          $ref: '#/components/schemas/FieldRef'
        value:
          $ref: '#/components/schemas/TypedValue'
        values:
          type: array
          minItems: 1
          maxItems: 1024
          items:
            $ref: '#/components/schemas/TypedValue'
        args:
          type: array
          minItems: 1
          maxItems: 1024
          items:
            $ref: '#/components/schemas/Predicate'
      additionalProperties: false
    ExtractStep:
      type: object
      required:
      - input
      - pattern
      - captures
      properties:
        input:
          $ref: '#/components/schemas/FieldRef'
        pattern:
          type: string
          description: Core regular expression.
        captures:
          type: object
          additionalProperties:
            type: object
            required:
            - name
            properties:
              name:
                type: string
                description: Named capture group; must occur exactly once.
              conversion:
                type: string
                enum:
                - string
                - integer
                - number
                - boolean
                - timestamp
            additionalProperties: false
      additionalProperties: false
    BranchStep:
      type: object
      required:
      - condition
      - thenOutputs
      - elseOutputs
      properties:
        condition:
          $ref: '#/components/schemas/Predicate'
        then:
          type: array
          items:
            $ref: '#/components/schemas/Step'
        else:
          type: array
          items:
            $ref: '#/components/schemas/Step'
        thenOutputs:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/Assignment'
        elseOutputs:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/Assignment'
      additionalProperties: false
    InstalledStep:
      type: object
      description: Runs a configured plugin instance revision.
      required:
      - instanceId
      - configurationRevision
      - input
      properties:
        instanceId:
          type: string
          format: uuid
        configurationRevision:
          $ref: '#/components/schemas/Revision'
        input:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/Assignment'
      additionalProperties: false
    Step:
      type: object
      description: Only the configuration member matching `kind` may be set.
      required:
      - id
      - kind
      - outputSchema
      properties:
        id:
          type: string
          minLength: 1
          description: UTF-8 without NUL; unique across the whole definition.
        kind:
          type: string
          enum:
          - map
          - extract
          - branch
          - installed
        outputSchema:
          type: object
          maxProperties: 1000
          additionalProperties:
            $ref: '#/components/schemas/FieldSchema'
        map:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/Assignment'
        extract:
          $ref: '#/components/schemas/ExtractStep'
        branch:
          $ref: '#/components/schemas/BranchStep'
        installed:
          $ref: '#/components/schemas/InstalledStep'
      additionalProperties: false
    Definition:
      type: object
      description: 'Workflow definition. Full semantics: docs/workflows.md.'
      required:
      - schemaVersion
      - selector
      - outputSchema
      - outputs
      properties:
        schemaVersion:
          $ref: '#/components/schemas/SchemaVersion'
        selector:
          $ref: '#/components/schemas/Predicate'
        steps:
          type: array
          maxItems: 128
          items:
            $ref: '#/components/schemas/Step'
          description: At most 128 steps in total, nested branch steps included.
        outputSchema:
          type: object
          maxProperties: 1000
          additionalProperties:
            $ref: '#/components/schemas/FieldSchema'
        outputs:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/Assignment'
      additionalProperties: false
    WorkflowScope:
      type: object
      description: >-
        Selects the Transmissions a Workflow processes. A Workflow reaches no Agency implicitly: it
        processes Transmissions on Radio networks of its `agencies` only, optionally narrowed to some
        Radio networks or Units of those Agencies. Managing it needs the action over every assigned
        Agency (or, with a narrowing, over every referenced Network's Agency or Unit).
      required:
      - agencies
      - narrowing
      properties:
        agencies:
          type: array
          minItems: 1
          maxItems: 256
          uniqueItems: true
          items:
            type: string
            format: uuid
          description: Assigned Agencies. Returned sorted. An unknown Agency is `INVALID_INPUT`.
        narrowing:
          type: object
          nullable: true
          description: >-
            `null` for every Radio network of the assigned Agencies. Every reference must belong to an
            assigned Agency and every assigned Agency must contain at least one reference; otherwise
            `INVALID_INPUT`.
          required:
          - kind
          - references
          properties:
            kind:
              type: string
              enum:
              - network
              - unit
            references:
              type: array
              minItems: 1
              maxItems: 1024
              uniqueItems: true
              items:
                type: string
                format: uuid
              description: Radio network or Unit identifiers, matching `kind`. Returned sorted.
          additionalProperties: false
      additionalProperties: false
    Workflow:
      type: object
      required:
      - id
      - revision
      - name
      - scope
      - enabled
      - createdAt
      - updatedAt
      properties:
        id:
          type: string
          format: uuid
        revision:
          $ref: '#/components/schemas/Revision'
        name:
          type: string
        scope:
          $ref: '#/components/schemas/WorkflowScope'
        enabled:
          type: boolean
        activeVersionId:
          type: string
          format: uuid
          description: Omitted when no version is active.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    WorkflowResponse:
      type: object
      required:
      - schemaVersion
      - data
      properties:
        schemaVersion:
          $ref: '#/components/schemas/SchemaVersion'
        data:
          $ref: '#/components/schemas/Workflow'
    WorkflowPageResponse:
      type: object
      required:
      - schemaVersion
      - data
      properties:
        schemaVersion:
          $ref: '#/components/schemas/SchemaVersion'
        data:
          type: object
          required:
          - items
          - total
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Workflow'
            total:
              type: integer
              minimum: 0
              description: Number of rows the caller may read, independent of paging.
    CreateWorkflowRequest:
      type: object
      required:
      - schemaVersion
      - commandId
      - name
      - scope
      - enabled
      properties:
        schemaVersion:
          $ref: '#/components/schemas/SchemaVersion'
        commandId:
          type: string
          format: uuid
          description: Client-generated idempotency key (not the nil UUID). Receipts are stored per (caller principal,
            commandId) and never expire.
        expectedRevision:
          type: string
          enum:
          - '0'
          description: Optional on create; only "0" is accepted.
        name:
          type: string
          minLength: 1
          pattern: \S
          description: Not blank, no NUL.
        scope:
          $ref: '#/components/schemas/WorkflowScope'
        enabled:
          type: boolean
      additionalProperties: false
    UpdateWorkflowRequest:
      type: object
      description: Must not carry `commandId`.
      required:
      - schemaVersion
      - expectedRevision
      - name
      - scope
      - enabled
      properties:
        schemaVersion:
          $ref: '#/components/schemas/SchemaVersion'
        expectedRevision:
          $ref: '#/components/schemas/Revision'
        name:
          type: string
          minLength: 1
          pattern: \S
          description: Not blank, no NUL.
        scope:
          $ref: '#/components/schemas/WorkflowScope'
        enabled:
          type: boolean
      additionalProperties: false
    Version:
      type: object
      required:
      - id
      - workflowId
      - definition
      - createdAt
      - createdBy
      properties:
        id:
          type: string
          format: uuid
        workflowId:
          type: string
          format: uuid
        definition:
          $ref: '#/components/schemas/Definition'
        createdAt:
          type: string
          format: date-time
        createdBy:
          type: string
          format: uuid
    VersionResponse:
      type: object
      required:
      - schemaVersion
      - data
      properties:
        schemaVersion:
          $ref: '#/components/schemas/SchemaVersion'
        data:
          $ref: '#/components/schemas/Version'
    VersionPageResponse:
      type: object
      required:
      - schemaVersion
      - data
      properties:
        schemaVersion:
          $ref: '#/components/schemas/SchemaVersion'
        data:
          type: object
          required:
          - items
          - total
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Version'
            total:
              type: integer
              minimum: 0
              description: Number of rows the caller may read, independent of paging.
    SaveVersionRequest:
      type: object
      description: '`expectedRevision` is the Workflow revision.'
      required:
      - schemaVersion
      - commandId
      - expectedRevision
      - definition
      properties:
        schemaVersion:
          $ref: '#/components/schemas/SchemaVersion'
        commandId:
          type: string
          format: uuid
          description: Client-generated idempotency key (not the nil UUID). Receipts are stored per (caller principal,
            commandId) and never expire.
        expectedRevision:
          $ref: '#/components/schemas/Revision'
        definition:
          $ref: '#/components/schemas/Definition'
      additionalProperties: false
    PreviewRequest:
      type: object
      description: Exactly one of `versionId` and `definition`; exactly one of `syntheticJson` and `storedTransmissionId`.
      required:
      - schemaVersion
      properties:
        schemaVersion:
          $ref: '#/components/schemas/SchemaVersion'
        versionId:
          type: string
          format: uuid
          description: Saved version to evaluate.
        definition:
