  /messages:
    get:
      operationId: listMessages
      tags:
      - Messages
      summary: Page of Messages, newest first
      description: |
        One row per Message the caller may read through an eligible appearance, ordered by
        `(messageTime, messageId)` descending. A caller without any `message.read` grant gets 403.
        Filters that need an unreadable field group are 403, never dropped: `text` and `protocol`
        need `payload`; `unit`, `organization`, `agency` and `withoutUnit` need `unit`; `network`
        needs `gateway`; a `filter` needs the field groups of the fields it reads (`payload`, `unit`,
        `derived`). Unknown or repeated scalar parameters, invalid UTF-8, text over 1024 bytes, more
        than 100 values per dimension, a `filter` that is malformed, over 32 KiB or reads an unknown,
        deprecated or non-filterable field, and a page token of other filters or another caller are
        400 `INVALID_INPUT`. Properties of a field group the caller
        cannot read are omitted. Paging uses keyset tokens, not offsets; there is no `total`.
        Each page is counted in a fixed one-minute window per access key, Principal or (guest) client
        source, up to `--search-attempts-per-minute`; beyond it the response is 429 `RATE_LIMITED`
        with `Retry-After` and the request is not counted.
