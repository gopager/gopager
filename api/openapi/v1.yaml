            format: uuid
      - name: agency
        in: query
        explode: true
        schema:
          type: array
          maxItems: 100
          items:
            type: string
            format: uuid
      - name: network
        in: query
        explode: true
        schema:
          type: array
          maxItems: 100
          items:
            type: string
            format: uuid
      - name: protocol
        in: query
