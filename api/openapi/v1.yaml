    get:
      operationId: readOrganization
      tags:
      - Organizations
      summary: Read an Organization
      description: Requires `organization.read`. Absent, deleted and invisible items are all 404. Evaluated against
        every member Unit; an Organization without members needs an `all` grant.
      security:
      - sessionCookie: []
      - accessKey: []
      - {}
      responses:
        '200':
          description: The resource.
          content:
            application/json:
              schema:
