          maxLength: 128
          pattern: \S
          description: 1–128 bytes of non-blank UTF-8, unique within the set.
        networkId:
          type: string
          format: uuid
        priority:
          type: integer
          minimum: 0
          description: Position in the Gateway's resolution order, 0 is the highest priority. Across the set the
            values are exactly 0..n-1 without duplicates.
      additionalProperties: false
    Network:
