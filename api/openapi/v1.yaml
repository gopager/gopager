              type: integer
              minimum: 0
    CreateAttributeSchemaRequest:
      type: object
      required:
      - schemaVersion
      - commandId
      - key
      - label
      - subject
      - fields
      - agencies
      properties:
        schemaVersion:
          $ref: '#/components/schemas/SchemaVersion'
        commandId:
          type: string
          format: uuid
          description: Client-generated idempotency key (not the nil UUID).
        key:
          type: string
          pattern: '^[a-z][a-z0-9-]*$'
          maxLength: 64
        label:
          type: string
          minLength: 1
          maxLength: 256
        description:
          type: string
          maxLength: 2048
        subject:
          type: string
          enum:
          - message
          - unit
        fields:
          type: object
          minProperties: 1
          additionalProperties:
            $ref: '#/components/schemas/AttributeField'
        agencies:
          $ref: '#/components/schemas/AssignedAgencies'
        deprecated:
          type: boolean
      additionalProperties: false
    UpdateAttributeSchemaRequest:
      type: object
      required:
      - schemaVersion
      - expectedRevision
      - label
      - subject
      - fields
      - agencies
      properties:
        schemaVersion:
          $ref: '#/components/schemas/SchemaVersion'
        expectedRevision:
          $ref: '#/components/schemas/Revision'
        label:
          type: string
          minLength: 1
          maxLength: 256
        description:
          type: string
          maxLength: 2048
        subject:
          type: string
          enum:
          - message
          - unit
        fields:
          type: object
          minProperties: 1
          additionalProperties:
            $ref: '#/components/schemas/AttributeField'
        agencies:
          $ref: '#/components/schemas/AssignedAgencies'
        deprecated:
          type: boolean
      additionalProperties: false
    Error:
      type: object
      required:
      - schemaVersion
      - code
      - parameters
      - textKey
      - fallback
      - requestId
      - retryable
      properties:
        schemaVersion:
          $ref: '#/components/schemas/SchemaVersion'
        code:
          type: string
          enum:
          - INVALID_INPUT
          - LOGIN_REQUIRED
          - FORBIDDEN
          - NOT_FOUND
          - REVISION_CONFLICT
          - IDEMPOTENCY_CONFLICT
          - INCOMPATIBLE_VERSION
          - RESOURCE_LIMIT
          - RATE_LIMITED
          - STORAGE_UNAVAILABLE
          - AUTHORITY_UNAVAILABLE
          - COMMIT_UNCERTAIN
          - DEPENDENCY_UNAVAILABLE
          - EXTERNAL_UNCERTAIN
          - INTERNAL_ERROR
          description: |
            Stable, language-independent code. HTTP status and `retryable` per code:
            `INVALID_INPUT` 400 (false); `LOGIN_REQUIRED` 401 (false); `FORBIDDEN` 403 (false);
            `NOT_FOUND` 404 (false); `REVISION_CONFLICT` 409 (true); `IDEMPOTENCY_CONFLICT` 409 (false);
            `INCOMPATIBLE_VERSION` 409 (false); `RESOURCE_LIMIT` 413 (false); `RATE_LIMITED` 429 (true);
            `STORAGE_UNAVAILABLE` 503 (true); `AUTHORITY_UNAVAILABLE` 503 (true); `COMMIT_UNCERTAIN` 503
            (false; the write may have committed, so re-send with the same `commandId`/`submissionId` or read
            the resource); `DEPENDENCY_UNAVAILABLE` 409 (false); `EXTERNAL_UNCERTAIN` 409 (false);
            `INTERNAL_ERROR` 500 (false).
        parameters:
          type: object
          properties:
            status:
              type: string
              enum:
              - unavailable
            instanceId:
              type: string
              format: uuid
            dependency:
              type: string
              enum:
              - input-ceiling
              - subscription
              - domain-event
              - data
              - input
            deliveryId:
              type: string
              format: uuid
          description: '`{}`, except: with `AUTHORITY_UNAVAILABLE` for a Subscription target or redelivery whose instance
            is missing, disabled or without a provider, `status` is `unavailable` and `instanceId` names the instance;
            with `DEPENDENCY_UNAVAILABLE`, `dependency` names what is missing; with `EXTERNAL_UNCERTAIN`, `deliveryId`
            names the uncertain Delivery.'
        textKey:
          type: string
          pattern: ^error\.[A-Z_]+$
          description: '`error.<code>`.'
        fallback:
          type: string
          description: Redacted English message; never contains internal causes.
        requestId:
          type: string
          format: uuid
          description: Fresh UUID per error response.
        retryable:
          type: boolean
        retryAfterSeconds:
          type: integer
          minimum: 1
          description: Only with `RATE_LIMITED`.
