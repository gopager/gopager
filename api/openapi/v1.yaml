  /messages/stream:
    get:
      operationId: streamMessages
      tags:
      - Messages
      summary: Live updates for a loaded range of the feed
      description: |
        Server-sent events (`text/event-stream; charset=utf-8`, `Cache-Control: no-store`) that keep
        a feed view current. Take the feed filters with a required `from` and an optional `until`
        (the range the client has loaded) and start at the `position` of the feed page: the stream
        then delivers every change after that page's snapshot, so nothing between the page and the
        stream is lost. The start position is the `Last-Event-ID` header when present (a reconnect
        resumes after the last `id` the client saw) and otherwise the `position` parameter; one of
        them is required. A request without `from`, without a start position, with an unknown
        parameter or with filters that are invalid is 400 `INVALID_INPUT` before any event is sent;
        a caller without a covering grant is 403, an unknown or expired credential 401. Each open
        counts against the search limit of the feed (429 `RATE_LIMITED`).

        Events (the `data` of every event is one JSON line):

        - `upsert`: a feed item (`MessageFeedItem`) that matches the view's filters other than the
          time range. The client places it by its `messageTime` or drops it when it lies outside the
          loaded range.
        - `remove`: `{"messageId"}`, the Message no longer belongs to the view.
          A Message merge the caller can see is answered with `resync-required`, never with
          removes of the absorbed Messages.
        - `resync-required`: `{}`; the view cannot be continued. The client reloads the feed and
          opens a new stream. The server closes the stream after it.
        - `error`: `{"code"}` with `LOGIN_REQUIRED` (or the public code of another failure). The
          authority of the caller ended; the server closes the stream after it and no further
          Message data is sent.
        - `heartbeat`: `{}` every 15 s when nothing else was sent, with the current position as `id`.

        The `id` of an event is a signed position `<txId>-<seq>-<issuedUnixSeconds>.<mac>`; treat it
        as opaque.
        Frames of one change carry it on their last frame only. A position issued before the replay
        window (`--live-replay-window`, default 24 h), a malformed one or one that the server never
        issued (its signature does not verify) is answered with `resync-required` in a 200 response. A change of the caller's
        access revision (grants, restrictions, field permissions) is `resync-required`, as is a
        change of Units, Unit collections, Organizations or Agencies, a batch of more than 256
        events or 1 MiB, and a fact of an unknown schema version.
      security:
      - sessionCookie: []
      - accessKey: []
      - {}
      parameters:
      - name: from
        in: query
        required: true
        schema:
          type: string
          format: date-time
        description: Inclusive lower bound of the loaded range.
      - name: until
        in: query
        schema:
          type: string
          format: date-time
        description: Exclusive upper bound of the loaded range.
      - name: position
        in: query
        schema:
          type: string
        description: The `position` of the feed page. Ignored when `Last-Event-ID` is sent.
      - name: Last-Event-ID
        in: header
        schema:
          type: string
        description: The `id` of the last event the client processed; takes precedence over `position`.
      - name: text
        in: query
        schema:
          type: string
          maxLength: 1024
      - name: unit
        in: query
        explode: true
        schema:
          type: array
          maxItems: 100
          items:
            type: string
            format: uuid
      - name: organization
        in: query
        explode: true
        schema:
          type: array
          maxItems: 100
          items:
            type: string
            format: uuid
      - name: agency
        in: query
        explode: true
        schema:
          type: array
          maxItems: 100
          items:
            type: string
            format: uuid
      - name: network
        in: query
        explode: true
        schema:
          type: array
          maxItems: 100
          items:
            type: string
            format: uuid
      - name: protocol
        in: query
        explode: true
        schema:
          type: array
          maxItems: 100
          items:
            type: string
            enum:
            - pocsag
            - flex
            - zvei
            - eas
      - name: filter
        in: query
        schema:
          type: string
          maxLength: 32768
        description: JSON-encoded `MessagePredicate`, at most once. It combines with the other parameters by AND. A
          field reference resolves to candidate values (an attribute to the effective value of every position the
          caller may see, a list to its elements); a comparison holds when one candidate satisfies it, `present`
          when there is a candidate. See docs/http-api.md (Messages).
      - name: withoutUnit
        in: query
        schema:
          type: boolean
      responses:
        '200':
          description: The event stream.
          content:
            text/event-stream:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
