        syntheticJson:
          description: Synthetic transmission document (any JSON, ≤ 1 MiB) whose `networkId` names a current Network of the same Protocol; see docs/workflows.md.
        storedTransmissionId:
          type: string
          format: uuid
      additionalProperties: false
    Dependency:
      type: object
      required:
      - transmissionId
      - sourceRevision
      - contextRevision
      - networkId
      - groups
      properties:
        transmissionId:
          type: string
          format: uuid
        sourceRevision:
          $ref: '#/components/schemas/Revision'
        contextRevision:
          $ref: '#/components/schemas/Revision'
        networkId:
          type: string
          format: uuid
        targetPosition:
          type: integer
          minimum: 0
        groups:
          type: array
          minItems: 1
          items:
            type: string
          description: Field groups the value depends on.
    FieldValue:
      type: object
      description: '`value` is present only when `state` is `present`. `dependencies` is the owner classification of a captured source field and is omitted on derived values: a definition is classified once, not per value (see docs/workflows.md).'
      required:
      - state
      properties:
        state:
          type: string
          enum:
          - present
          - absent
        value:
          $ref: '#/components/schemas/TypedValue'
        dependencies:
          type: array
          items:
            $ref: '#/components/schemas/Dependency'
    Evaluation:
      type: object
      required:
      - selected
      properties:
        selected:
          type: boolean
        fields:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/FieldValue'
          description: Omitted when not selected or when results are per target; `{}` when selected without outputs.
        targetResults:
          type: array
          items:
            type: object
            required:
            - targetPosition
            - fields
            properties:
              targetPosition:
                type: integer
                minimum: 0
              fields:
                type: object
                additionalProperties:
                  $ref: '#/components/schemas/FieldValue'
          description: Per original target position, for target-dependent Workflows.
    EvaluationResponse:
      type: object
      required:
      - schemaVersion
      - data
      properties:
        schemaVersion:
          $ref: '#/components/schemas/SchemaVersion'
        data:
          $ref: '#/components/schemas/Evaluation'
    Candidate:
      type: object
      required:
      - id
      - revision
      - state
      - updatedAt
      properties:
        id:
          type: string
          format: uuid
        revision:
          $ref: '#/components/schemas/Revision'
        state:
          type: string
          enum:
          - pending
          - running
          - completed
          - failed
          - superseded
        selected:
          type: boolean
          description: Present only when `state` is `completed`.
        failureCode:
          type: string
          enum:
          - INVALID_INPUT
          - INCOMPATIBLE_VERSION
          - RESOURCE_LIMIT
          - STORAGE_UNAVAILABLE
          - AUTHORITY_UNAVAILABLE
          - INTERNAL_ERROR
          description: Present only for some `failed` candidates.
        updatedAt:
          type: string
          format: date-time
    MessageFeedItem:
      type: object
      required:
      - messageId
      - messageTime
      - processingStatus
      - correctionStatus
      properties:
        messageId:
          type: string
          format: uuid
        messageTime:
          type: string
          format: date-time
          description: The stored Message time (earliest observation), which may stem from a member the caller cannot see.
        processingStatus:
          type: string
          enum:
          - none
          - pending
          - completed
          - failed
          description: '`pending` if any supporting readable Transmission is pending, else `failed`, else `completed`, else `none`.'
        correctionStatus:
          type: string
          enum:
          - current
          - correcting
        payload:
          description: Original Payload of the Representative Transmission. Field group `payload`.
          type: object
          additionalProperties: true
        protocol:
          type: string
          enum:
          - pocsag
          - flex
          - zvei
          - eas
          description: Field group `payload`.
        incomplete:
          type: boolean
          description: Field group `payload`.
        units:
          type: array
          description: Eligible Unit appearances. Field group `unit`.
          items:
            $ref: '#/components/schemas/MessageUnit'
        withoutUnit:
          type: boolean
          description: An eligible Unit-less appearance exists. Field group `unit`.
        attributes:
          type: array
          description: Effective Message attribute values with their provenance, sorted by schema key, field and
            position (the Transmission-level value first). Shown when the caller reads `derived`; a value comes from
            a result only if the caller may read every field group stored with it. Field group `derived`.
          items:
            $ref: '#/components/schemas/MessageAttribute'
        networkUnresolved:
          type: boolean
          description: Present (true) only where `network.read` reaches the Network's Agency.
    MessageUnit:
      type: object
      required:
      - unitId
      - name
      - agencyId
      - encrypted
      properties:
        unitId:
          type: string
          format: uuid
        name:
          type: string
        agencyId:
          type: string
          format: uuid
        organizationId:
          type: string
          format: uuid
        encrypted:
          type: boolean
          description: An assigned target came from an encrypted Address rule. A label only; nothing claims decryption.
        firstObservedAt:
          type: string
          format: date-time
          description: Detail only.
    MessageAttribute:
      type: object
      description: The effective value of one attribute field at one position, the present value of the latest
        published result.
      required:
      - schemaKey
      - field
      - value
      - workflowId
      - definitionVersionId
      - resultId
      - publishedAt
      properties:
        schemaKey:
          type: string
        field:
          type: string
        targetPosition:
          type: integer
          minimum: 0
          description: Original target position of a target-level value, only for targets the caller may see.
        unitId:
          type: string
          format: uuid
          description: The Unit the target is assigned to. Field group `unit`.
        value:
          $ref: '#/components/schemas/TypedValue'
        workflowId:
          type: string
          format: uuid
        definitionVersionId:
          type: string
          format: uuid
        resultId:
          type: string
          format: uuid
        publishedAt:
          type: string
          format: date-time
    MessageFieldRef:
      type: object
      description: Reference to a Message field. `message` takes one path element (`id`, `time`, `processingStatus`,
        `correctionStatus`, `protocol`, `form`, `text`, `numeric`, `unitIds`, `unitNames`); `attributes` takes the
        schema key, the field name and optionally object property names.
      required:
      - namespace
      - path
      properties:
        namespace:
          type: string
          enum:
          - message
          - attributes
        path:
          type: array
          minItems: 1
          maxItems: 32
          items:
            type: string
            minLength: 1
      additionalProperties: false
    MessagePredicate:
      type: object
      description: Same shape and operators as `Predicate`, over Message fields. Nests at most 32 levels. Only
        scalars and lists of scalars can be compared; `contains` is a case-sensitive substring test.
      required:
      - op
      properties:
        op:
          type: string
          enum:
          - and
          - or
          - not
          - present
          - eq
          - in
          - lt
          - lte
          - gt
          - gte
          - contains
        field:
          $ref: '#/components/schemas/MessageFieldRef'
        value:
          $ref: '#/components/schemas/TypedValue'
        values:
          type: array
          minItems: 1
          maxItems: 1024
          items:
            $ref: '#/components/schemas/TypedValue'
        args:
          type: array
          minItems: 1
          maxItems: 1024
          items:
            $ref: '#/components/schemas/MessagePredicate'
      additionalProperties: false
    SavedViewDefinition:
      type: object
      description: Feed filters of a saved view; unknown fields are 400.
      required:
      - schemaVersion
      - filters
      properties:
        schemaVersion:
          $ref: '#/components/schemas/SchemaVersion'
        filters:
          type: object
          additionalProperties: false
          properties:
            text:
              type: string
              maxLength: 1024
            units:
              type: array
              maxItems: 100
              items:
                type: string
                format: uuid
            withoutUnit:
              type: boolean
            agencies:
              type: array
              maxItems: 100
              items:
                type: string
                format: uuid
            organizations:
              type: array
              maxItems: 100
              items:
                type: string
                format: uuid
            networks:
              type: array
              maxItems: 100
              items:
                type: string
                format: uuid
            protocols:
              type: array
              maxItems: 100
              items:
                type: string
                enum:
                - pocsag
                - flex
                - zvei
                - eas
            filter:
              $ref: '#/components/schemas/MessagePredicate'
        from:
          type: string
          format: date-time
        until:
          type: string
          format: date-time
      additionalProperties: false
    SavedView:
      type: object
      required:
      - id
      - revision
      - ownership
      - name
      - definition
      - unavailableFilters
      - createdAt
      - updatedAt
      properties:
        id:
          type: string
          format: uuid
        revision:
          $ref: '#/components/schemas/Revision'
        ownership:
          type: string
          enum:
          - personal
          - global
        name:
          type: string
          minLength: 1
          maxLength: 256
        definition:
          $ref: '#/components/schemas/SavedViewDefinition'
        unavailableFilters:
          type: array
          description: Sorted filter dimensions, named like the feed query parameters, whose field group the caller
            cannot read now. Empty if none.
          items:
            type: string
            enum:
            - agency
            - filter
            - network
            - organization
            - protocol
            - text
            - unit
            - withoutUnit
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    SavedViewResponse:
      type: object
      required:
      - schemaVersion
      - data
      properties:
        schemaVersion:
          $ref: '#/components/schemas/SchemaVersion'
        data:
          $ref: '#/components/schemas/SavedView'
    SavedViewPageResponse:
      type: object
      required:
      - schemaVersion
      - data
      properties:
