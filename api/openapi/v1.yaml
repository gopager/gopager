          enum:
          - admin
          - user
        secret:
          type: boolean
        configured:
          type: boolean
        redacted:
          type: boolean
          description: True for configured secret or user-scoped values.
        value:
          description: Plain JSON value of a configured, visible scalar.
        properties:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/ConfigurationField'
        items:
          type: array
          items:
            $ref: '#/components/schemas/ConfigurationField'
    Instance:
      type: object
      required:
      - id
      - revision
      - enabled
      - executionPrincipalId
      - main
      - createdAt
      - configuration
      properties:
        id:
          type: string
          format: uuid
        revision:
          $ref: '#/components/schemas/Revision'
        enabled:
          type: boolean
        executionPrincipalId:
