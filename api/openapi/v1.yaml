      security:
      - sessionCookie: []
      - accessKey: []
      - {}
      parameters:
      - $ref: '#/components/parameters/Offset'
      - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Caller-visible page; `total` counts only rows the caller may read.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgencyPageResponse'
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    post:
      operationId: createAgency
      tags:
      - Agencies
      summary: Create an Agency
      description: 'Requires `agency.create`. Idempotent per (caller, `commandId`): an identical replay
        returns the original result; reusing the `commandId` with different input is 409 `IDEMPOTENCY_CONFLICT`.'
      security:
      - sessionCookie: []
        csrfToken: []
      - accessKey: []
      - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAgencyRequest'
      responses:
        '201':
          description: Agency created (or replayed).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandResponse'
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/RevisionConflict'
        '413':
          $ref: '#/components/responses/ResourceLimit'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /agencies/{id}:
    parameters:
    - $ref: '#/components/parameters/ID'
    get:
      operationId: readAgency
      tags:
      - Agencies
      summary: Read an Agency
      description: Requires `agency.read`. Absent, deleted and invisible items are all 404.
      security:
      - sessionCookie: []
      - accessKey: []
      - {}
      responses:
