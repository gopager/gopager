      - createdAt
      properties:
        layoutId:
          type: string
          format: uuid
        version:
          $ref: '#/components/schemas/Revision'
        definition:
          $ref: '#/components/schemas/LayoutDefinition'
        createdAt:
          type: string
          format: date-time
    LayoutResponse:
      type: object
      required:
      - schemaVersion
      - data
