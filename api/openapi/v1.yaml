      required:
      - schemaVersion
      - data
      properties:
        schemaVersion:
          $ref: '#/components/schemas/SchemaVersion'
        data:
          $ref: '#/components/schemas/LayoutVersion'
    LayoutPageResponse:
      type: object
      required:
      - schemaVersion
      - data
      properties:
        schemaVersion:
          $ref: '#/components/schemas/SchemaVersion'
        data:
          type: object
          required:
          - items
          - total
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Layout'
            total:
              type: integer
              minimum: 0
    CreateLayoutRequest:
      type: object
      required:
      - schemaVersion
      - commandId
      - name
      - definition
      properties:
        schemaVersion:
          $ref: '#/components/schemas/SchemaVersion'
        commandId:
          type: string
          format: uuid
          description: Client-generated idempotency key (not the nil UUID).
        name:
          type: string
          minLength: 1
          maxLength: 256
          description: Valid UTF-8, not blank, at most 256 bytes.
        definition:
          $ref: '#/components/schemas/LayoutDefinition'
        agencies:
          $ref: '#/components/schemas/AssignedAgencies'
      additionalProperties: false
    UpdateLayoutRequest:
      type: object
      required:
      - schemaVersion
      - expectedRevision
      - name
      - definition
      properties:
        schemaVersion:
          $ref: '#/components/schemas/SchemaVersion'
        expectedRevision:
