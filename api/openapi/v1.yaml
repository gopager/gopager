openapi: 3.0.3
info:
  title: GoPager API
  version: 1.9.0
  description: |
    GoPager application API. Human guide: docs/http-api.md.

    Conventions:

    - Request bodies are `application/json` (parameters such as `charset` allowed); any other
      media type is 400 `INVALID_INPUT`. Every JSON request body carries `"schemaVersion": 1`.
      Unknown fields and trailing data are rejected with 400.
    - Responses are `application/json` with `Cache-Control: no-store`. Most successful responses
      are wrapped as `{"schemaVersion": 1, "data": ...}`. Exceptions: `/auth/*`,
      `/gateways/{id}/networks` and `/gateways/{id}/credentials*` return unwrapped bodies that carry `schemaVersion` directly. 204 responses
      have no body.
    - Body size limits per route group are listed in docs/http-api.md (Request size limits).
      Overflow is 413 `RESOURCE_LIMIT`.
    - Revisions are positive decimal strings. Updates and deletes send `expectedRevision` in the
      JSON body (no ETag/If-Match); DELETE requests carry a body.
    - Creating operations take a client-generated `commandId` (UUID). Re-sending the same input
      with the same `commandId` returns the original result without a second change; a different
      operation or input is 409 `IDEMPOTENCY_CONFLICT` (not retryable). Revision-based updates and the preview routes must not
      send a `commandId`.
    - Lists use `offset` and `limit` (defaults and range: docs/http-api.md, Pagination). Any
      other, repeated or non-integer query parameter is 400. Responses are `{"items": [...], "total": N}` where
      `total` counts only caller-visible rows.
    - Timestamps are RFC 3339 in UTC, possibly with fractional seconds. IDs are UUIDs; the nil
      UUID is always invalid.
    - While the process is not ready or is shutting down, every /api/v1 route returns 503
      `AUTHORITY_UNAVAILABLE`. Unmatched paths and methods return Go `net/http` 404/405 with a
      `text/plain` body, not the JSON error envelope.
servers:
- url: /api/v1
tags:
- name: Platform
  description: Liveness and readiness probes (outside /api/v1).
- name: Auth
  description: Local password login and browser sessions.
- name: Organizations
  description: Organizations and the setting defaults their Units inherit.
- name: Unit templates
  description: Standalone templates copied into new Units.
- name: Units
  description: Units, including bulk changes.
- name: Agencies
- name: Unit collections
  description: Named Unit collections.
- name: Address rules
  description: Temporal address-to-Unit rules per Network.
- name: Suppressions
  description: Per-target assignment suppressions.
- name: Assignment corrections
  description: Asynchronous historical re-evaluation.
- name: Ingest
  description: Gateway submissions and state reports (Gateway credential).
- name: Networks
  description: Radio networks of one Protocol, owned by an Agency. A caller without any `network.*` right on an
    existing Network gets 404; one with another right but not the requested one gets 403.
- name: Gateways
  description: Gateway lifecycle, diagnostics and state history (wrapped), Network assignments and credentials
    (unwrapped). A caller without any `gateway.*` right covering an existing Gateway gets 404; one with another
    right but not the requested one gets 403.
- name: Messages
  description: Authorized Message feed, detail and filter options. Rows are eligible per appearance (Unit or
    Unit-less) under the caller's grants; field groups decide which properties are projected.
- name: Saved views
  description: Personal and global saved Message filter sets. A personal view is visible only to its owner (others
    get 404); a global view is readable by every caller with any `message.read` grant and by its managers, and
    maintained with `saved-view.manage-global`. Views write no domain event and no audit record.
- name: Workflows
  description: Processing Workflows, versions, preview and candidates.
- name: Processing instances
  description: Configured plugin instances.
- name: Subscriptions
  description: Personal and global Subscriptions that select Domain event types and send authorized, rendered input to
    delivery targets. A Subscription the caller may not manage is 404.
- name: Deliveries
  description: Inspectable results of Subscription sends, with explicit retry and confirmed redelivery. `accepted`
    means the provider accepted the input, not that anyone read it; an acceptance cannot be recalled.
- name: Layouts
  description: Named, versioned arrangements of fields that Subscriptions render Domain events with.
- name: Attribute schemas
  description: Administrator-defined, typed field declarations for Message and Unit attributes, assigned to Agencies.
paths:
  /health/live:
    get:
      operationId: readLiveness
      tags:
      - Platform
      summary: Liveness probe
      description: 'Served outside /api/v1 and outside the readiness gate. Always answers 200; `live` reports the
        current liveness flag. Other methods return 405 with `Allow: GET` and no body. The response carries no `Cache-Control`
        header and no `schemaVersion`.'
      security: []
      responses:
        '200':
          description: Current liveness.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Liveness'
      servers:
      - url: /
        description: Platform endpoints are served at the listener root, outside /api/v1.
  /health/ready:
    get:
      operationId: readReadiness
      tags:
      - Platform
      summary: Readiness probe
      description: 'Served outside /api/v1 and outside the readiness gate. Other methods return 405 with `Allow:
        GET` and no body. While not ready, every /api/v1 route answers 503 `AUTHORITY_UNAVAILABLE`.'
      security: []
      responses:
        '200':
          description: Ready (`ready` is true).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Readiness'
        '503':
          description: The process is not ready (`ready` is false).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Readiness'
      servers:
      - url: /
        description: Platform endpoints are served at the listener root, outside /api/v1.
  /auth/login:
    post:
      operationId: login
      tags:
      - Auth
      summary: Log in with a local password
      description: |
        Requires exactly one `Origin` header equal to the configured public origin; otherwise
        403 `FORBIDDEN` (checked before the body is read). Only active human accounts with a local
        password and the `password.local` right can log in; unknown user, wrong password, inactive
        account and missing right all return the same 401 `LOGIN_REQUIRED`. Usernames are compared
        after Unicode NFC normalization and case folding and are not trimmed. The body is limited to
        16 KiB; a larger body is 413 `RESOURCE_LIMIT`. Attempts are rate limited per
        normalized username and per instance (429 with `Retry-After`).
      security: []
      parameters:
      - $ref: '#/components/parameters/OriginHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Session created. The `gopager_session` cookie is set.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
          headers:
            Set-Cookie:
              description: 'Host-only `gopager_session` cookie: `Path=/`, `HttpOnly`, `SameSite=Lax`, `Expires`
                = absolute session expiry, `Secure` only when the public origin uses https.'
              schema:
                type: string
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/ResourceLimit'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /auth/session:
    get:
      operationId: readSession
      tags:
      - Auth
      summary: Read the current session
      description: Use it to recover the CSRF token after a page reload. Returns 401 `LOGIN_REQUIRED` unless the
        request is authenticated by a valid session cookie (bearer-authenticated and anonymous requests included).
      security:
      - sessionCookie: []
      responses:
        '200':
          description: Current session, including the CSRF token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /auth/logout:
    post:
      operationId: logout
      tags:
      - Auth
      summary: Revoke the current session
      description: Session authentication only (other credentials return 401). Requires the `session.manage-own`
        right plus the Origin and `X-CSRF-Token` checks. No request body is read.
      security:
      - sessionCookie: []
        csrfToken: []
      responses:
        '204':
          description: Session revoked. The cookie is expired (`Max-Age=0`).
          headers:
            Set-Cookie:
              description: Expires `gopager_session`.
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /agencies:
    get:
      operationId: listAgencies
      tags:
      - Agencies
      summary: List Agencies
      description: Requires `agency.read`. Offset paging; any other query parameter is 400.
      security:
      - sessionCookie: []
      - accessKey: []
      - {}
      parameters:
      - $ref: '#/components/parameters/Offset'
      - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Caller-visible page; `total` counts only rows the caller may read.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgencyPageResponse'
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    post:
      operationId: createAgency
      tags:
      - Agencies
      summary: Create an Agency
      description: 'Requires `agency.create`. Idempotent per (caller, `commandId`): an identical replay
        returns the original result; reusing the `commandId` with different input is 409 `IDEMPOTENCY_CONFLICT`.'
      security:
      - sessionCookie: []
        csrfToken: []
      - accessKey: []
      - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAgencyRequest'
      responses:
        '201':
          description: Agency created (or replayed).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandResponse'
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/RevisionConflict'
        '413':
          $ref: '#/components/responses/ResourceLimit'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /agencies/{id}:
    parameters:
    - $ref: '#/components/parameters/ID'
    get:
      operationId: readAgency
      tags:
      - Agencies
      summary: Read an Agency
      description: Requires `agency.read`. Absent, deleted and invisible items are all 404.
      security:
      - sessionCookie: []
      - accessKey: []
      - {}
      responses:
        '200':
          description: The resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgencyResponse'
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    put:
      operationId: renameAgency
      tags:
      - Agencies
      summary: Rename an Agency
      description: Requires `agency.update`. Optimistic concurrency via `expectedRevision`; a stale value
        is 409 `REVISION_CONFLICT`.
      security:
      - sessionCookie: []
        csrfToken: []
      - accessKey: []
      - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAgencyRequest'
      responses:
        '200':
          description: New revision.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandResponse'
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/RevisionConflict'
        '413':
          $ref: '#/components/responses/ResourceLimit'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    delete:
      operationId: deleteAgency
      tags:
      - Agencies
      summary: Delete an Agency
      description: Requires `agency.delete` (scope `all`). Optimistic concurrency via `expectedRevision`; a stale
        value, or an Agency that still owns Units or Networks or is the only Agency of an undeleted
        Workflow, a Layout or an Attribute schema, is 409 `REVISION_CONFLICT`. Assignments of other
        definitions to the Agency are removed with it.
      security:
      - sessionCookie: []
        csrfToken: []
      - accessKey: []
      - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteRequest'
      responses:
        '200':
          description: Deleted; final revision.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandResponse'
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/RevisionConflict'
        '413':
          $ref: '#/components/responses/ResourceLimit'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
