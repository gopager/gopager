name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Static checks and quick tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Formatting
        run: make fmt-check
      - name: go vet
        run: make vet
      - name: golangci-lint
        run: make golangci
      - name: Documentation links and IDs
        run: make docs-check
      - name: Quick tests
        run: make test
      - name: Generated code is current
        run: make generate-check

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    needs: static
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # The runner's Docker daemon starts the PostgreSQL containers the tests need.
      - name: Integration tests with the race detector
        run: make test-integration

  # govulncheck against the Go version pinned in go.mod; a reachable vulnerability fails the build.
  vulnerabilities:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: govulncheck
        run: make vuln
