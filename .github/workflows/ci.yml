name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Static checks and quick tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - name: Formatting
        run: make fmt-check
      - name: go vet
        run: make vet
      - name: golangci-lint
        run: make golangci
      - name: Documentation links and IDs
        run: make docs-check
      - name: Quick tests
        run: make test
      - name: Generated code is current
        run: make generate-check

  # The integration tests run in three shards on separate runners: the command tests and the
  # store tests are the two longest packages, and every package starts its own PostgreSQL
  # container, so one runner's four cores were the bottleneck.
  integration-shard:
    name: Integration tests (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [command, stores, other]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          # The shared setup-go cache holds the non-race build of whichever job saved it first;
          # the race build has its own cache below.
          cache: false
      # Each run saves its race build under a new key and restores the newest earlier one, so
      # only changed packages are compiled again.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-race-${{ matrix.shard }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-race-${{ matrix.shard }}-${{ hashFiles('go.sum') }}-
            go-race-${{ matrix.shard }}-
      # The runner's Docker daemon starts the PostgreSQL containers the tests need.
      - name: Integration tests with the race detector
        run: |
          case "${{ matrix.shard }}" in
            command) packages=./cmd/... ;;
            stores) packages=./internal/persistence/ent/borrowed/... ;;
            other) packages="$(go list ./... | grep -v -e '/cmd/' -e '/internal/persistence/ent/borrowed$' | tr '\n' ' ')" ;;
          esac
          make test-race PKGS="$packages" TEST_REPORT_DIR=build/test-reports/${{ matrix.shard }}
      # Reports and the slowest-test list are kept even when the tests fail.
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: test-reports-${{ matrix.shard }}
          path: build/test-reports/${{ matrix.shard }}
          if-no-files-found: warn
      # Only when a report exists: a build failure before the first test leaves none.
      - name: Slowest tests
        if: always() && hashFiles(format('build/test-reports/{0}/test.json', matrix.shard)) != ''
        run: |
          {
            echo '### Slowest tests (${{ matrix.shard }})'
            echo '```'
            make -s test-slowest TEST_REPORT_DIR=build/test-reports/${{ matrix.shard }}
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # The required check: it passes only when every shard passed.
  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    needs: integration-shard
    if: always()
    steps:
      - name: All shards passed
        run: test "${{ needs.integration-shard.result }}" = success

  # Builds the deployable image without pushing it, so a release can never be cut from a tree
  # whose image does not build. Third-party actions are pinned to commits.
  image:
    name: Container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/compose/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # govulncheck against the Go version pinned in go.mod; a reachable vulnerability fails the build.
  vulnerabilities:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - name: govulncheck
        run: make vuln
