name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Static checks and quick tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - name: Formatting
        run: make fmt-check
      - name: go vet
        run: make vet
      - name: golangci-lint
        run: make golangci
      - name: Documentation links and IDs
        run: make docs-check
      - name: Quick tests
        run: make test
      - name: Generated code is current
        run: make generate-check

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    # Runs alongside the static checks instead of after them, so the pipeline takes as long as
    # its slowest job rather than the sum of both.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      # The runner's Docker daemon starts the PostgreSQL containers the tests need.
      - name: Integration tests with the race detector
        run: make test-race
      # Reports and the slowest-test list are kept even when the tests fail.
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: test-reports
          path: build/test-reports
          if-no-files-found: warn
      # Only when a report exists: a build failure before the first test leaves none.
      - name: Slowest tests
        if: always() && hashFiles('build/test-reports/test.json') != ''
        run: |
          {
            echo '### Slowest tests'
            echo '```'
            make -s test-slowest
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # Builds the deployable image without pushing it, so a release can never be cut from a tree
  # whose image does not build. Third-party actions are pinned to commits.
  image:
    name: Container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/compose/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # govulncheck against the Go version pinned in go.mod; a reachable vulnerability fails the build.
  vulnerabilities:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - name: govulncheck
        run: make vuln
